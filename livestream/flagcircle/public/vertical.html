<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flag Circle Survival LIVE</title>
<style>
/* Flag Circle Survival im Hochformat 9:16, Bühne 1080×1920, Neo-Brutalism-Look wie die anderen Spiele, Grundfarbe tiefes Blaugrün/Nachtblau.
   Handy-sichtbar: x 110–970, y 240–1090. Arena und Zähler liegen dort; Titel + Bestenliste darunter. */
@font-face{font-family:Inter;src:url(fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{--ink:#111;--paper:#0f172a;--dot:#1b2a4a;--card:#f8f4eb;--y:#fed439;--p:#ff7b9c;--c:#61d4f5;--l:#b6f36a;--o:#ff8a3d;--g:#0a6b42}
*{box-sizing:border-box;margin:0;padding:0}
html,body,*{cursor:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:Inter,"Noto Color Emoji",system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:var(--paper);
  background-image:radial-gradient(var(--dot) 2.4px,transparent 2.4px);background-size:36px 36px}
.box{background:var(--card);border:6px solid #111;border-radius:16px;box-shadow:10px 10px 0 #000}
.label{display:inline-block;font-size:24px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:#fff;color:#111;
  padding:4px 14px;border:4px solid #111;border-radius:8px;box-shadow:4px 4px 0 #111;margin-bottom:14px}
canvas#game{position:absolute;left:0;top:0}
#top{position:absolute;top:244px;left:110px;right:110px;display:flex;align-items:center;justify-content:center;gap:16px}
.pill{font-size:34px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#111;padding:6px 22px 8px;border:6px solid #111;border-radius:14px;box-shadow:8px 8px 0 #000;white-space:nowrap}
#p1{background:var(--y);transform:rotate(-1.5deg)}
#p2{background:var(--c);transform:rotate(1.5deg)}
#p2 b{font-size:40px}
#win{position:absolute;left:110px;right:110px;top:440px;display:none;flex-direction:column;align-items:center;gap:14px;z-index:6;pointer-events:none}
#win .big{font-size:250px;line-height:1;filter:drop-shadow(10px 10px 0 rgba(0,0,0,.5))}
#win .nm{font-size:64px;font-weight:900;text-transform:uppercase;color:#111;background:var(--y);border:6px solid #111;border-radius:14px;box-shadow:8px 8px 0 #000;padding:2px 26px 6px;transform:rotate(-2deg)}
#win .wl{font-size:44px;font-weight:900;color:#fff;text-shadow:4px 4px 0 #111,-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111;letter-spacing:.06em}
#solvers{position:absolute;top:1010px;left:110px;right:110px;display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;z-index:7}
.sol{display:flex;align-items:center;gap:10px;padding:2px 14px;font-size:28px;font-weight:800;min-width:0;background:var(--card);border:5px solid #111;border-radius:12px;box-shadow:5px 5px 0 #000}
.sol .m{font-size:30px}.sol .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sol .p{color:var(--g);font-weight:900}.sol .fl2{font-weight:900;color:#d13a00}
.sol.first{background:var(--y)}.sol.more{justify-content:center}.sol.all{grid-column:1/-1;justify-content:center}
#low{position:absolute;top:1150px;left:110px;right:110px;display:flex;flex-direction:column;align-items:center;gap:26px}
#head{display:flex;align-items:center;justify-content:center;gap:18px}
.live{display:inline-flex;align-items:center;gap:10px;background:#ff3b3b;color:#fff;font-weight:900;font-size:28px;letter-spacing:.06em;
  padding:5px 16px;border:5px solid #111;border-radius:10px;box-shadow:6px 6px 0 #000;transform:rotate(-4deg)}
.live i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #111;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
h1{font-size:60px;font-weight:900;letter-spacing:-.035em;line-height:1;color:#fff;text-shadow:5px 5px 0 #ff4b72;white-space:nowrap}
#topbox{width:100%;padding:18px 26px 14px;background:var(--y)!important}
.row{display:flex;align-items:center;gap:12px;font-size:32px;font-weight:800;padding:5px 0}
.row .r{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;background:#fff;border:3px solid #111;border-radius:6px;flex:none}
.row .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row .p{font-weight:900}
.rec{font-size:30px;font-weight:800}
#how{font-size:30px;font-weight:800;color:#fff;text-align:center}
#how b{background:var(--y);color:#111;padding:0 10px;border:3px solid #111;border-radius:6px}
#chatpop{position:absolute;top:322px;left:110px;right:110px;height:48px;display:flex;justify-content:center;pointer-events:none;z-index:2}
#chatpop .cp2{display:inline-flex;align-items:center;gap:10px;max-width:860px;font-size:26px;font-weight:900;color:#111;white-space:nowrap;overflow:hidden;
  padding:2px 18px 4px;background:#fff;border:5px solid #111;border-radius:12px;box-shadow:6px 6px 0 #000}
#chatpop .cp2 .u{max-width:420px;overflow:hidden;text-overflow:ellipsis}
#chatpop .cp2.w{background:var(--p);transform:rotate(-1.5deg)}
#chatpop .cp2.f{background:var(--c)}
#chatpop .cp2.o{background:var(--o)}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:8}
</style></head>
<body><div id="stage">
  <canvas id="game" width="1080" height="1920"></canvas>
  <div id="top"><div class="pill" id="p1">Who survives?</div><div class="pill" id="p2">Still in <b id="cnt">16</b></div></div>
  <div id="chatpop"></div>
  <div id="win"><div class="wl">SURVIVOR</div><div class="big"></div><div class="nm"></div></div>
  <div id="solvers"></div>
  <div id="low">
    <div id="head"><div class="live"><i></i>LIVE</div><h1>Flag Circle Survival</h1></div>
    <div class="box" id="topbox"><div class="label">Top today</div><div id="board"></div></div>
    <div id="how">tip the winner in chat: <b>DE</b> <b>BR</b> <b>JP</b></div>
  </div>
  <canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script>
const fit=()=>{const s=Math.min(innerWidth/1080,innerHeight/1920);document.getElementById('stage').style.transform=`scale(${s})`};addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flagOf=c=>String.fromCodePoint(...[...c].map(x=>0x1F1E6+x.charCodeAt(0)-65));

// Federn wie beim Wortraten (Dämpfung + Antwortzeit als CSS linear()-Kurve)
const springCache={};
function spring(damping=1,response=.4){
  const k=damping+'/'+response; if(springCache[k]) return springCache[k];
  const w=2*Math.PI/response, z=damping, pts=[]; let dur=0;
  const x=t=>{ if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t))} return 1-Math.exp(-w*t)*(1+w*t) };
  for(let t=0;t<3;t+=1/120){ if(t>.1 && Math.abs(1-x(t))<.001 && Math.abs(1-x(t+.05))<.001){dur=t;break} dur=t }
  for(let i=0;i<=60;i++) pts.push(+x(dur*i/60).toFixed(4));
  return springCache[k]={easing:`linear(${pts.join(',')})`,duration:dur*1000};
}
const pop=(el,from,d=.8,r=.38,delay=0)=>{const s=spring(d,r);el.animate([from,{transform:'none',opacity:1}],{duration:s.duration,easing:s.easing,delay,fill:'backwards'})};

// Ton (Pentatonik-Glocken wie beim Wortraten)
const AC=new (window.AudioContext||window.webkitAudioContext)(), master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
function bell(f,d=.5,v=.14,at=0){const t=AC.currentTime+at;for(const [m,vv] of [[1,1],[2.01,.35],[3.02,.12]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*vv,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
const sfx={reveal:i=>bell(PENTA[i%PENTA.length],.35,.07), hint:()=>{bell(659.25,.4,.09);bell(987.77,.5,.07,.08)},
  correct:p=>{const b=[1046.5,880,783.99][Math.min(p,2)];bell(b,.6,.14);bell(b*1.5,.7,.08,.07)},
  start:()=>[0,2,4].forEach((n,i)=>bell(PENTA[n],.5,.08,i*.08)), end:()=>[0,2,4,5].forEach((n,i)=>bell(PENTA[n],.9,.1,i*.09)), miss:()=>bell(392,.8,.08)};
const music=new Audio(); music.volume=.32; let mlist=[], mi=0;
async function nextSong(){ try{ if(!mlist.length||mi>=mlist.length){ mlist=(await (await fetch('/api/music')).json()).sort(()=>Math.random()-.5); mi=0 } if(!mlist.length) return; music.src='/music/'+encodeURIComponent(mlist[mi++%mlist.length]); await music.play() }catch{} }
music.onended=nextSong; music.onerror=()=>{mlist=[];setTimeout(nextSong,3000)}; nextSong(); document.addEventListener('click',()=>{AC.resume();if(music.paused)nextSong()});

const fx=$('fx').getContext('2d'); let parts=[];
function confetti(x,y,n=60){const cols=['#ff5d8d','#7c5cff','#2ec4a6','#ffb627','#5ab4ff'];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=8+Math.random()*12;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[i%5],r:Math.random()*5+4,a:Math.random()*6,l:80+Math.random()*40})}}
(function loop(){fx.clearRect(0,0,1080,1920);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.15;fx.save();fx.translate(p.x,p.y);fx.rotate(p.a);fx.fillStyle=p.c;fx.globalAlpha=Math.min(1,p.l/30);fx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fx.restore()}requestAnimationFrame(loop)})();


const sfxC={out:()=>{bell(220,.5,.12);bell(165,.6,.1,.06)}, tick:()=>bell(1760,.06,.03), near:()=>bell(1318.5,.12,.05)};
const G=$('game').getContext('2d');
const CX=540, CY=720, R=360, BR_=38, SPEED=520;
let S=null, ver=null, sim=null, lastT=0, lastN=0, shownN=0, lastSolv=0, lastFeed=0;

// ---- Flaggen-Bälle: Emoji einmal in ein Rundbild zeichnen ----
const ballImg={};
function ballFor(code){
  if(ballImg[code]) return ballImg[code];
  const d=BR_*2, c=document.createElement('canvas'); c.width=c.height=d*2; const x=c.getContext('2d'); x.scale(2,2);
  x.beginPath(); x.arc(BR_,BR_,BR_-1,0,7); x.closePath(); x.fillStyle='#fff'; x.fill(); x.save(); x.clip();
  x.font=`${BR_*2.1}px "Noto Color Emoji",Inter,sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(flagOf(code),BR_,BR_+4); x.restore();
  x.lineWidth=5; x.strokeStyle='#111'; x.beginPath(); x.arc(BR_,BR_,BR_-1.5,0,7); x.stroke();
  // Kürzel unten als kleines Etikett (zum Tippen)
  x.font='900 19px Inter,sans-serif'; x.textAlign='center'; x.textBaseline='middle'; const w=x.measureText(code).width+12;
  x.fillStyle='#111'; x.fillRect(BR_-w/2,BR_*2-26,w,22); x.fillStyle='#fff'; x.fillText(code,BR_,BR_*2-14);
  return ballImg[code]=c;
}
const rnd=(a,b)=>a+Math.random()*(b-a);

function initSim(s){
  const balls=s.codes.map((code,i)=>{ const a=i/s.codes.length*Math.PI*2, rr=R*0.55*Math.sqrt(Math.random()+.1), sp=rnd(.85,1.15)*SPEED, d=rnd(0,Math.PI*2);
    return {code, x:CX+Math.cos(a)*rr, y:CY+Math.sin(a)*rr, vx:Math.cos(d)*sp, vy:Math.sin(d)*sp, alive:true, fall:0, s:1, rot:rnd(0,6.28)} });
  // Bälle, die sich beim Start überlappen, auseinanderschieben
  for(let k=0;k<30;k++) for(let i=0;i<balls.length;i++) for(let j=i+1;j<balls.length;j++){ const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1; if(d<BR_*2){ const p=(BR_*2-d)/2; a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p } }
  sim={n:s.n,balls,t:0,holeA:rnd(0,Math.PI*2),holeW:.05,sinceOut:0,left:balls.length,posted:false,slow:1,shake:0,outs:[]};
}
function stepSim(dt){
  const m=sim; if(!m||m.posted) return;
  const live=m.balls.filter(b=>b.alive&&!b.fall), nLeft=live.length;
  m.slow=nLeft<=2?0.45:nLeft<=3?0.7:1; dt*=m.slow; m.t+=dt; m.sinceOut+=dt;
  m.holeA+=dt*(nLeft<=3?.5:.75);
  // Loch wird breiter, je länger niemand rausfiel (Tempo ≈ alle 2–3 s ein Ball), nach einem Ausfall wieder eng
  m.holeW=Math.min(.5,.035+.09*Math.max(0,m.sinceOut-1.4));
  const sub=3, h=dt/sub;
  for(let s=0;s<sub;s++){
    for(const b of live){ b.x+=b.vx*h; b.y+=b.vy*h; b.rot+=h*.8 }
    for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
      const a=live[i],b=live[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,md=BR_*2;
      if(d2<md*md&&d2>.01){ const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,p=(md-d)/2; a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;
        const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(rv<0){ a.vx+=rv*nx;a.vy+=rv*ny;b.vx-=rv*nx;b.vy-=rv*ny; if(-rv>300) m.shake=Math.min(1,m.shake+.3) } }
    }
    for(const b of live){
      const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy);
      if(d+BR_>R){
        let ang=Math.atan2(dy,dx), diff=Math.atan2(Math.sin(ang-m.holeA),Math.cos(ang-m.holeA));
        if(Math.abs(diff)<m.holeW && d+BR_>R+4){ b.fall=1; b.fvx=dx/d*260; b.fvy=dy/d*260; knockOut(b); continue }   // durchs Loch
        const nx=dx/d,ny=dy/d,vn=b.vx*nx+b.vy*ny;
        if(Math.abs(diff)>=m.holeW||d+BR_>R+14){ if(vn>0){ b.vx-=2*vn*nx; b.vy-=2*vn*ny } if(Math.abs(diff)>=m.holeW){ b.x=CX+nx*(R-BR_); b.y=CY+ny*(R-BR_) } }
      }
      // Tempo konstant halten (kein Einschlafen), kleine Zufallsablenkung
      const sp=Math.hypot(b.vx,b.vy)||1, tgt=SPEED*(nLeft<=3?.85:1), k=1+(tgt/sp-1)*.05; b.vx*=k; b.vy*=k;
    }
  }
  for(const b of m.balls){ if(b.fall){ b.fall+=dt*1.4; b.x+=b.fvx*dt; b.y+=b.fvy*dt; b.s=Math.max(0,1-(b.fall-1)*1.1); if(b.fall>1.9) b.alive=false } }
  if(m.shake>0) m.shake=Math.max(0,m.shake-dt*2);
}
function knockOut(b){
  const m=sim; m.sinceOut=0; m.left=m.balls.filter(x=>x.alive&&!x.fall).length; m.outs.push(b.code); $('cnt').textContent=m.left; pop($('p2'),{transform:'scale(1.25)'},.5,.4); lastCnt=m.left;
  fetch('/api/out',{method:'POST',body:JSON.stringify({n:m.n,code:b.code})}).catch(()=>{});
  sfxC.out(); const w=m.left; if(w<=1){ m.posted=true; const last=m.balls.find(x=>x.alive&&!x.fall)||b; fetch('/api/out',{method:'POST',body:JSON.stringify({n:m.n,win:last.code})}).catch(()=>{}) }
}
function draw(){
  G.clearRect(0,0,1080,1920);
  const m=sim; const sh=m?m.shake*6:0; G.save(); G.translate(rnd(-sh,sh),rnd(-sh,sh));
  // Arena: Neon-Ring mit Loch
  const hA=m?m.holeA:0, hW=m?m.holeW:.05;
  G.fillStyle='rgba(97,212,245,.07)'; G.beginPath(); G.arc(CX,CY,R,0,7); G.fill();
  G.lineCap='round';
  for(const [w,c,blur] of [[24,'#ff4b72',28],[12,'#fff',0]]){
    G.lineWidth=w; G.strokeStyle=c; G.shadowColor='#ff4b72'; G.shadowBlur=blur; G.beginPath(); G.arc(CX,CY,R+14,hA+hW,hA-hW+Math.PI*2); G.stroke();
  }
  G.shadowBlur=0; G.strokeStyle='#111'; G.lineWidth=4; G.beginPath(); G.arc(CX,CY,R+27,hA+hW,hA-hW+Math.PI*2); G.stroke(); G.beginPath(); G.arc(CX,CY,R+1,hA+hW,hA-hW+Math.PI*2); G.stroke();
  // Loch-Rand leuchtet gelb
  G.strokeStyle='#fed439'; G.lineWidth=10; G.shadowColor='#fed439'; G.shadowBlur=22;
  for(const sgn of [-1,1]){ const a=hA+sgn*hW; G.beginPath(); G.moveTo(CX+Math.cos(a)*(R-6),CY+Math.sin(a)*(R-6)); G.lineTo(CX+Math.cos(a)*(R+32),CY+Math.sin(a)*(R+32)); G.stroke() }
  G.shadowBlur=0;
  if(m){
    for(const b of m.balls){ if(!b.alive||(S&&S.phase==='show')) continue; const img=ballFor(b.code), s=b.s, d=BR_*2*s;
      if(b.fall){ G.globalAlpha=Math.max(0,s); }
      G.save(); G.translate(b.x,b.y); G.shadowColor='rgba(0,0,0,.55)'; G.shadowBlur=0; G.shadowOffsetX=5*s; G.shadowOffsetY=5*s; G.drawImage(img,-d/2,-d/2,d,d); G.restore(); G.globalAlpha=1 }
  }
  G.restore();
}
let lastCnt=-1;
async function poll(){
  try{
    const s=await (await fetch('/api/state',{cache:'no-store'})).json();
    if(ver && s.v!==ver) return location.reload(); ver=s.v; S=s;
    if(s.n!==lastN){ lastN=s.n; lastSolv=0; $('solvers').innerHTML=''; $('win').style.display='none'; initSim(s); sfx.start(); lastCnt=-1;
      $('p1').animate([{transform:'scale(.7) rotate(-8deg)',opacity:0},{transform:'none',opacity:1}],{duration:400,easing:'cubic-bezier(.2,1.4,.4,1)'}) }
    if(s.phase==='run' && sim && sim.n===s.n){ const c=sim.left; if(c!==lastCnt){ $('cnt').textContent=c; if(lastCnt>0) pop($('p2'),{transform:'scale(1.25)'},.5,.4); lastCnt=c } }
    if(s.phase==='show' && shownN!==s.n){ shownN=s.n; if(sim) sim.posted=true;
      $('win').querySelector('.big').textContent=flagOf(s.winner); $('win').querySelector('.nm').textContent=s.winnerName; $('win').style.display='flex';
      pop($('win'),{transform:'scale(.3) rotate(-10deg)',opacity:0},.55,.55); sfx.end(); confetti(540,640,110); setTimeout(()=>confetti(300,700,60),300); setTimeout(()=>confetti(780,700,60),500); $('cnt').textContent='1' }
    renderSolvers();
    $('p1').textContent=s.phase==='run'?(s.left<=4?'Final '+s.left+'!':'Who survives?'):'We have a winner';
  }catch{}
}
function renderSolvers(){
  const m=['🥇','🥈','🥉'], s=S.solvers, box=$('solvers');
  for(let i=lastSolv;i<s.length;i++){ const x=s[i], d=document.createElement('div');
    d.className='sol'+(i?'':' first'); d.innerHTML=`<span class="m">${m[i]}</span><span class="n">${x.flag} ${esc(x.user)}</span>${x.streak>=2?`<span class="fl2">🔥${x.streak}</span>`:''}<span class="p">${x.mult>1?'⚡':''}+${x.pts}</span>`;
    box.appendChild(d); pop(d,{transform:'translateY(30px)',opacity:0},1,.4,i*120); if(i===0) sfx.correct(0) }
  lastSolv=s.length;
  if(S.nSolvers>3 && !box.querySelector('.more')){ const d=document.createElement('div'); d.className='sol more'; d.textContent=`+${S.nSolvers-3} more tipped right`; box.appendChild(d) }
  if(S.phase==='show' && !S.nSolvers && !box.querySelector('.all')){ const d=document.createElement('div'); d.className='sol all'; d.textContent=S.nTips?'Nobody tipped the survivor':'Tip the winner next round'; box.appendChild(d) }
}
setInterval(poll,300); poll();
function frame(t){ const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t; if(S&&S.phase==='run') stepSim(dt); else if(sim&&S&&S.phase==='show') { for(const b of sim.balls) if(b.alive&&!b.fall){ b.x+=b.vx*dt*.2; b.y+=b.vy*dt*.2 } } draw(); requestAnimationFrame(frame) }
requestAnimationFrame(frame);
async function pollBoard(){
  try{
    const b=await (await fetch('/api/board',{cache:'no-store'})).json();
    $('board').innerHTML=b.top.slice(0,5).map((x,i)=>`<div class="row"><span class="r">${i+1}</span><span class="n">${x.flag} ${esc(x.user)}</span><span class="p">${x.pts}</span></div>`).join('')||'<div class="rec">Be the first to score</div>';
  }catch{}
}
setInterval(pollBoard,2000); pollBoard();

let popQ=[], popBusy=false, feedSince=0, feedFirst=true;
function showPop(){
  if(popBusy||!popQ.length) return; popBusy=true;
  const w=popQ.findIndex(x=>x.welcome||x.levelUp), x=w>=0?popQ.splice(w,1)[0]:popQ.pop(); if(w<0) popQ=[];
  const u=`<span class="u">${esc(x.user)}</span>`;
  const html=x.out?`${flagOf(x.out)} is out!`:x.levelUp?`${x.badge} ${u} is now ${esc(x.levelUp)}!`:x.welcome?`👋 Welcome ${u}! Tip the winner`:x.flag&&!x.tip?`${u} ${x.flag} joined`:x.late?`${u} ${x.tip} too late`:x.dead?`${u} ${x.tip} is already out`:`${u} ${x.flag||''} tips ${x.tip} ${esc(x.name||'')}`;
  $('chatpop').innerHTML=`<div class="cp2${x.out?' o':x.welcome||x.levelUp?' w':x.flag&&!x.tip?' f':''}">${html}</div>`; pop($('chatpop').firstChild,{transform:'scale(.6)',opacity:0},.6,.35);
  if(x.welcome) bell(PENTA[4],.4,.06);
  setTimeout(()=>{ const el=$('chatpop').firstChild; if(el) el.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'}); setTimeout(()=>{popBusy=false;showPop()},220) }, x.welcome||x.levelUp?3000:1300);
}
async function pollFeed(){
  try{
    const f=await (await fetch('/api/feed?since='+feedSince,{cache:'no-store'})).json(); feedSince=f.last;
    if(feedFirst){ feedFirst=false; return }
    for(const x of f.feed) popQ.push(x); popQ=popQ.slice(-12); showPop();
  }catch{}
}
setInterval(pollFeed,700); pollFeed();
