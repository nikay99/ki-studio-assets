<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Guess the Word LIVE</title>
<style>
/* Wortraten-Stream, Hybrid (Niklas 09.10.): heller Pastell-Look der ersten Fassung (weiße 3D-Kacheln, lila Knopf, pinkes LIVE)
   plus Apple-Details (Inter mit engem Tracking, weißes Glas, Federn, sparsames Konfetti, Ton im selben Frame).
   1920×1080; alles Wichtige in der Mitte (Handy zeigt ~490 px). */
@font-face{font-family:Inter;src:url(fonts/InterVariable.woff2) format("woff2");font-weight:100 900;font-display:block}
:root{
  --bg0:#ffe4ec;--bg1:#e6e0ff;
  --glass:rgba(255,255,255,.72);--edge:rgba(255,255,255,.9);
  --ink:#2b2140;--ink2:#7a6f8f;--ink3:#a99fbd;
  --pink:#ff5d8d;--violet:#7c5cff;--violet-d:#5a3fd1;--mint:#2ec4a6;--mint-d:#1f9a82;--gold:#ffb627;--red:#ff3b5c;
  --tile-sh:#d9cff0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg0);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:linear-gradient(135deg,var(--bg0),var(--bg1))}
/* Farbflächen hinter dem Glas: sehr langsam (60 s), damit nichts pulsiert */
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6;animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.12)}}
.col{position:absolute;top:0;bottom:0}
#mid{left:656px;width:608px;display:flex;flex-direction:column;align-items:center;padding-top:118px}
#left{left:48px;width:552px;padding-top:150px}
#right{right:48px;width:552px;padding-top:150px}

.glass{background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--edge);border-radius:28px;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 50px rgba(90,63,209,.12)}
.card{padding:26px 30px;margin-bottom:24px}
.label{font-size:21px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--violet);margin-bottom:14px}

.live{display:inline-flex;align-items:center;gap:10px;background:var(--pink);color:#fff;font-weight:800;font-size:22px;letter-spacing:.08em;
  padding:7px 18px 7px 16px;border-radius:999px;box-shadow:0 4px 0 #d93f6e,0 10px 24px rgba(255,93,141,.35)}
.live i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
h1{font-size:74px;font-weight:900;letter-spacing:-.04em;line-height:1.02;margin-top:16px;color:var(--ink)}
.sub{font-size:26px;font-weight:600;color:var(--ink2);margin-top:6px;letter-spacing:-.01em}

#hero{position:relative;margin-top:30px;display:flex;flex-direction:column;align-items:center}
#cat{font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
#emoji{position:relative;font-size:132px;line-height:1.15;margin:6px 0 12px;filter:drop-shadow(0 14px 18px rgba(90,63,209,.18))}
#emoji::before{content:"";position:absolute;inset:-30px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),transparent)}
#emoji.flag{font-size:156px}
#tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:600px}
.word{display:flex;gap:10px}
/* 3D-Kacheln wie in der ersten Fassung: weiß mit lila Kante unten */
.t{display:flex;align-items:center;justify-content:center;font-weight:900;letter-spacing:-.02em;border-radius:18px;
  background:rgba(255,255,255,.6);border:2px solid #e2d9f6;color:var(--ink3);box-shadow:0 3px 0 rgba(217,207,240,.7)}
.t.on{background:#fff;color:var(--ink);border:0;box-shadow:0 5px 0 var(--tile-sh),0 12px 22px rgba(90,63,209,.12)}
.t.solved{background:var(--mint);color:#fff;border:0;box-shadow:0 5px 0 var(--mint-d),0 14px 28px rgba(46,196,166,.35)}

#timer{width:520px;height:12px;border-radius:999px;background:rgba(255,255,255,.7);margin-top:30px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(90,63,209,.12)}
#bar{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--violet));transition:width .3s linear}
#bar.low{background:linear-gradient(90deg,var(--gold),var(--pink))}
#cta{margin-top:24px;font-size:30px;font-weight:800;letter-spacing:-.015em;padding:15px 34px;border-radius:999px;color:#fff;
  background:var(--violet);box-shadow:0 6px 0 var(--violet-d),0 16px 30px rgba(124,92,255,.35)}
#cta.wait{background:#fff;color:var(--ink2);box-shadow:0 5px 0 var(--tile-sh)}

#solvers{margin-top:22px;width:540px;display:flex;flex-direction:column;gap:10px}
.sol{display:flex;align-items:center;gap:14px;padding:12px 22px;border-radius:22px;font-size:28px;font-weight:700}
.sol .m{font-size:30px}.sol .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.sol .p{color:var(--mint-d);font-weight:900}
.sol.first{background:linear-gradient(90deg,#fff3d1,rgba(255,255,255,.75));border-color:#ffd77a}
.sol.more{justify-content:center;font-size:22px;color:var(--ink2);font-weight:600}

.row{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700;padding:7px 0;letter-spacing:-.01em}
.row .r{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;background:#efeaff;color:var(--ink2)}
.row.g1 .r{background:var(--gold);color:#4a2e00}.row.g2 .r{background:#d9dbe6;color:#22232b}.row.g3 .r{background:#e9a873;color:#3b1d06}
.row .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row .p{font-weight:900;color:var(--violet)}
.rec{font-size:24px;font-weight:600;color:var(--ink2);padding:5px 0}.rec b{color:var(--ink);font-weight:800}
#feed .row{font-size:24px;padding:6px 0}
.ok{color:var(--mint-d);font-weight:800}.no{color:var(--ink3);text-decoration:line-through;font-weight:600;letter-spacing:.04em}
.how{font-size:24px;font-weight:600;color:var(--ink2);line-height:1.6}.how b{color:var(--ink)}
canvas#fx{position:absolute;inset:0;pointer-events:none}
</style></head>
<body><div id="stage">
  <div class="orb" style="left:-160px;top:560px;width:640px;height:640px;background:#ffb3cd"></div>
  <div class="orb" style="right:-140px;top:-160px;width:700px;height:700px;background:#c7b8ff;animation-delay:-20s"></div>
  <div class="orb" style="left:700px;top:760px;width:520px;height:520px;background:#b5f0e2;opacity:.5;animation-delay:-40s"></div>

  <div class="col" id="left">
    <div class="glass card"><div class="label">Top players today</div><div id="top"></div></div>
    <div class="glass card" id="records"></div>
  </div>

  <div class="col" id="mid">
    <div class="live"><i></i>LIVE</div>
    <h1>Guess the Word</h1>
    <div class="sub">Type your answer in chat</div>
    <div id="hero"><div id="cat"></div><div id="emoji"></div><div id="tiles"></div></div>
    <div id="timer"><div id="bar"></div></div>
    <div id="cta">💬 Type it in chat</div>
    <div id="solvers"></div>
  </div>

  <div class="col" id="right">
    <div class="glass card"><div class="label">Live guesses</div><div id="feed"></div></div>
    <div class="glass card how"><div class="label">How to play</div>
      <div><b>Type the word</b> in chat</div><div><b>Everyone right</b> scores · fastest most</div><div><b>Type your country</b> for a flag</div>
    </div>
  </div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>
<script>
const fit=()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`scale(${s})`};addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Federn (Apple: Dämpfung + Antwortzeit statt fester Dauer) als CSS linear()-Kurve ----------
const springCache={};
function spring(damping=1,response=.4){
  const k=damping+'/'+response; if(springCache[k]) return springCache[k];
  const w=2*Math.PI/response, z=damping, pts=[]; let dur=0;
  const x=t=>{ if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t))} return 1-Math.exp(-w*t)*(1+w*t) };
  for(let t=0;t<3;t+=1/120){ if(t>.1 && Math.abs(1-x(t))<.001 && Math.abs(1-x(t+.05))<.001){dur=t;break} dur=t }
  for(let i=0;i<=60;i++) pts.push(+x(dur*i/60).toFixed(4));
  return springCache[k]={easing:`linear(${pts.join(',')})`,duration:dur*1000};
}
const pop=(el,from,d=.8,r=.38,delay=0)=>{const s=spring(d,r);el.animate([from,{transform:'none',opacity:1}],{duration:s.duration,easing:s.easing,delay,fill:'backwards'})};

// ---------- Ton: weich, harmonisch (Pentatonik), feuert im selben Frame wie das Bild ----------
const AC=new (window.AudioContext||window.webkitAudioContext)(), master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
function bell(f,d=.5,v=.14,at=0){const t=AC.currentTime+at;for(const [m,vv] of [[1,1],[2.01,.35],[3.02,.12]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*vv,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
const sfx={
  reveal:i=>bell(PENTA[i%PENTA.length],.35,.07),
  correct:p=>{const b=[1046.5,880,783.99][Math.min(p,2)];bell(b,.6,.14);bell(b*1.5,.7,.08,.07)},
  start:()=>[0,2,4].forEach((n,i)=>bell(PENTA[n],.5,.08,i*.08)),
  end:()=>[0,2,4,5].forEach((n,i)=>bell(PENTA[n],.9,.1,i*.09)),
  miss:()=>bell(392,.8,.08),
};
const music=new Audio(); music.volume=.32; let mlist=[], mi=0;
async function nextSong(){ try{ if(!mlist.length) mlist=(await (await fetch('/api/music')).json()).sort(()=>Math.random()-.5); if(!mlist.length) return; music.src='/music/'+encodeURIComponent(mlist[mi++%mlist.length]); await music.play() }catch{} }
music.onended=nextSong; nextSong(); document.addEventListener('click',()=>{AC.resume();if(music.paused)nextSong()});

// ---------- Konfetti nur für den Erstplatzierten und die Auflösung (sparsam, sonst stumpft es ab) ----------
const fx=$('fx').getContext('2d'); let parts=[];
function confetti(x,y,n=60){const cols=['#ff5d8d','#7c5cff','#2ec4a6','#ffb627','#5ab4ff'];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2.2,v=8+Math.random()*12;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:cols[i%5],r:Math.random()*5+4,a:Math.random()*6,l:80+Math.random()*40})}}
(function loop(){fx.clearRect(0,0,1920,1080);parts=parts.filter(p=>p.l-->0);for(const p of parts){p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.15;fx.save();fx.translate(p.x,p.y);fx.rotate(p.a);fx.fillStyle=p.c;fx.globalAlpha=Math.min(1,p.l/30);fx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fx.restore()}requestAnimationFrame(loop)})();

// ---------- Zustand ----------
let S=null, lastN=0, shownN=0, lastSolv=0, ver=null, feedSince=0, tileEls=[], revSet=new Set();
function tileSize(words){const longest=Math.max(...words.map(w=>w.length)),total=words.reduce((a,w)=>a+w.length,0)+words.length-1;
  let s=Math.min(88,Math.floor(((longest>7?580:480)-(longest-1)*10)/longest)); if(total>12&&words.length>1)s=Math.min(s,66); return Math.max(44,s)}
function buildTiles(){
  const words=[]; let cur=[]; S.tiles.forEach((ch,i)=>{ if(ch===' '){words.push(cur);cur=[]} else cur.push(i) }); words.push(cur);
  const sz=tileSize(words); tileEls=[]; revSet=new Set();
  $('tiles').innerHTML=words.map(w=>`<div class="word">${w.map(i=>`<div class="t" data-i="${i}" style="width:${sz}px;height:${Math.round(sz*1.14)}px;font-size:${Math.round(sz*.6)}px"></div>`).join('')}</div>`).join('');
  $('tiles').querySelectorAll('.t').forEach(el=>tileEls[+el.dataset.i]=el);
  [...$('tiles').querySelectorAll('.t')].forEach((el,k)=>pop(el,{transform:'translateY(24px) scale(.9)',opacity:0},1,.45,k*30));
}
function updateTiles(){
  let k=0;
  S.tiles.forEach((ch,i)=>{ const el=tileEls[i]; if(!el||!ch||revSet.has(i)) return; revSet.add(i); el.textContent=ch; el.classList.add('on');
    if(S.phase==='guess'){ pop(el,{transform:'scale(.7)'},.7,.35); sfx.reveal(revSet.size) } });
  if(S.phase==='show' && !$('tiles').dataset.solved){ $('tiles').dataset.solved=S.n; tileEls.forEach((el,i)=>{ if(!el) return; el.textContent=S.tiles[i]; el.classList.add('solved');
    pop(el,{transform:'scale(.86)'},.65,.4,(k++)*45) }) }   // Welle von links nach rechts: zeigt, wohin es geht
}
function renderSolvers(){
  const m=['🥇','🥈','🥉'], s=S.solvers, box=$('solvers');
  if(String(S.n)!==box.dataset.n){ box.dataset.n=S.n; box.innerHTML=''; lastSolv=0 }
  for(let i=lastSolv;i<Math.min(s.length,3);i++){ const x=s[i], d=document.createElement('div');
    d.className='sol glass'+(i?'':' first'); d.innerHTML=`<span class="m">${m[i]}</span><span class="n">${x.flag} ${esc(x.user)}</span><span class="p">+${x.pts}</span>`;
    box.appendChild(d); pop(d,{transform:'translateY(30px)',opacity:0},1,.4); sfx.correct(i); if(!i) confetti(960,650,60) }
  if(s.length>3){ let more=box.querySelector('.more'); if(!more){ more=document.createElement('div'); more.className='sol more'; box.appendChild(more); pop(more,{opacity:0},1,.3) }
    more.textContent=`+ ${s.length-3} more got it`; if(s.length>lastSolv) sfx.correct(2) }
  if(!s.length && S.phase==='show' && !box.querySelector('.more')){ const d=document.createElement('div'); d.className='sol more'; d.textContent='Nobody got it – the next one is easier'; box.appendChild(d); pop(d,{opacity:0},1,.3) }
  lastSolv=s.length;
}
async function poll(){
  try{
    const s=await (await fetch('/api/state',{cache:'no-store'})).json();
    if(ver && s.v!==ver) return location.reload(); ver=s.v; S=s;
    if(s.n!==lastN){ lastN=s.n; delete $('tiles').dataset.solved; $('cat').textContent=s.cat+' · '+s.tiles.filter(c=>c!==' ').length+' letters'; $('emoji').textContent=s.emoji; $('emoji').className=s.flagRound?'flag':'';
      pop($('emoji'),{transform:'scale(.6)',opacity:0},.7,.45); buildTiles(); sfx.start() }
    updateTiles(); renderSolvers();
    if(s.phase==='show' && shownN!==s.n){ shownN=s.n; if(s.solvers.length){ sfx.end(); confetti(960,520,80) } else sfx.miss() }
    const left=s.phase==='guess'?Math.max(0,(s.end-s.now)/(s.end-s.start)):0; $('bar').style.width=(left*100)+'%'; $('bar').className=left<.3?'low':'';
    const cta=$('cta'); cta.textContent=s.phase==='guess'?(s.solvers.length?'⏱️ Still time – type it':'💬 Type it in chat'):'Next word in a moment'; cta.className=s.phase==='guess'?'':'wait';
  }catch{}
}
setInterval(poll,300); poll();

async function pollBoard(){
  try{
    const b=await (await fetch('/api/board',{cache:'no-store'})).json();
    $('top').innerHTML=b.top.slice(0,8).map((x,i)=>`<div class="row g${i+1}"><span class="r">${i+1}</span><span class="n">${x.flag} ${esc(x.user)}</span><span class="p">${x.pts}</span></div>`).join('')||'<div class="rec">Be the first to score</div>';
    let r='<div class="label">Today</div>';
    if(b.fastest) r+=`<div class="rec">⚡ Fastest <b>${esc(b.fastest.user)}</b> · ${(b.fastest.ms/1000).toFixed(1)} s</div>`;
    if(b.streak&&b.streak.n>1) r+=`<div class="rec">🔥 <b>${esc(b.streak.user)}</b> · ${b.streak.n} in a row</div>`;
    r+=`<div class="rec">🎯 <b>${b.rounds}</b> words · <b>${b.players}</b> players</div>`; $('records').innerHTML=r;
  }catch{}
}
setInterval(pollBoard,2000); pollBoard();

async function pollFeed(){
  try{
    const f=await (await fetch('/api/feed?since='+feedSince,{cache:'no-store'})).json(); feedSince=f.last; const box=$('feed');
    for(const e of f.feed){ const d=document.createElement('div'); d.className='row';
      d.innerHTML=e.ok?`<span class="n">${esc(e.user)}</span><span class="ok">got it ✓</span>`:`<span class="n">${esc(e.user)}</span><span class="no">${esc(e.guess)}</span>`;
      box.prepend(d); pop(d,{transform:'translateY(-16px)',opacity:0},1,.35) }
    while(box.children.length>9) box.lastChild.remove();
  }catch{}
}
setInterval(pollFeed,700);
</script>
</body></html>
