<!doctype html>
<html><head><meta charset="utf-8"><title>Country Marble Race LIVE</title>
<style>html,body{margin:0;background:#0b0f1e;overflow:hidden;cursor:none}canvas{display:block;position:absolute;top:0;left:0}</style>
<script src="/matter.min.js"></script><script src="/countries.js"></script>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Länder-Kugelrennen LIVE. Physik: Matter.js (fester 60-Hz-Takt), Darstellung: eigenes Canvas, Ton: WebAudio.
// Daten vom lokalen server.js: /api/lineup (Teilnehmer), /api/events (Chat-Beitritte), /api/result, /api/music.
// Aufbau 16:9 mit 9:16-Spalte in der Mitte: YouTube schneidet für Handys die Bildmitte aus (608 von 1920 Breite).
// Alles, was man zum Mitspielen braucht (Bahn, Aufruf, Ansagen, Sieger), liegt in dieser Spalte; links/rechts nur Zusatzinfos.
const {Engine, Bodies, Body, Composite, Events} = Matter;
const W = 1920, H = 1080, CW = 608, CX = (W-CW)/2, TW = CW, R = 17, FINISH_Y = 7900, WORLD_H = 8200, START_WAIT = 60*8, MAX_BALLS = 48;
const Q = new URLSearchParams(location.search), OFFLINE = Q.has('offline');
const OUT_W = +(Q.get('w')||1280), SC = OUT_W/W;     // Ausgabe 1280x720 spart ~55 % Rechenzeit gegenüber 1080p
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = OUT_W; cv.height = Math.round(H*SC);
const NAME = Object.fromEntries(COUNTRY_LIST.map(c=>[c[0],c[1]]));

let engine, balls, statics, spinners, t, finished, raceNo = 0, phase, phaseT, chatLog = [], camY = 0, trackLayer, trackSeed = 0, rand;
let thirdT = 0, leader = null, lastEv = -1, board = {races:0, countries:[], players:[], fans:[]}, nextUp = [], toasts = [];

function seedRand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

// ---------- Bahn (3 Varianten, wechseln jedes Rennen) ----------
const PALETTES = [
  {peg:'#f472b6', ramp:'#22d3ee', paddle:'#facc15', bump:'#a78bfa', fun:'#34d399', bg:['#111733','#1a0f2e']},
  {peg:'#fb923c', ramp:'#a3e635', paddle:'#38bdf8', bump:'#f43f5e', fun:'#facc15', bg:['#0f1f1a','#0b1426']},
  {peg:'#60a5fa', ramp:'#f472b6', paddle:'#34d399', bump:'#fbbf24', fun:'#c084fc', bg:['#1f1020','#0d1530']},
];
let PAL = PALETTES[0];
function buildTrack(variant){
  const S = [], sp = [];
  const wall = (x,y,w,h,a=0,col='#1e293b')=>{const b=Bodies.rectangle(x,y,w,h,{isStatic:true,angle:a,friction:0.02,restitution:0.3});b.col=col;S.push(b);return b};
  const peg  = (x,y,r,col)=>{const b=Bodies.circle(x,y,r,{isStatic:true,restitution:0.7});b.col=col;b.peg=true;S.push(b)};
  wall(20,WORLD_H/2,40,WORLD_H); wall(TW-20,WORLD_H/2,40,WORLD_H);
  // Startgitter (öffnet sich nach dem Countdown)
  const gate = wall(TW/2,300,TW-80,14,0,'#e2e8f0'); gate.gate = true;
  // 1) Stift-Feld (Abstand zur Wand ≥ Kugeldurchmesser, sonst klemmen Kugeln)
  const off = variant===1 ? 16 : 0;
  for(let r=0;r<9;r++) for(let c=0;c<10;c++){const x=64+off+c*64+(r%2?32:0); if(x>=90&&x<=TW-90) peg(x,560+r*92,8,PAL.peg)}
  // 2) Zickzack-Rampen
  const n = variant===2 ? 5 : 6;
  for(let i=0;i<n;i++){const left=i%2===0, y=1500+i*(1400/n); wall(left?260:TW-260,y,440,22,left?0.18:-0.18,PAL.ramp)}
  // 3) Drehende Paddel
  for(let i=0;i<3;i++) for(let j=0;j<2;j++){
    const b=Bodies.rectangle(j?TW-180:180,3100+i*300,210,18,{isStatic:true,restitution:0.4});
    b.col=PAL.paddle; b.spin=((i+j)%2?1:-1)*(0.025+0.01*i+(variant*0.004)); S.push(b); sp.push(b)}
  // 4) zweites Stift-Feld + flache Rampen (mischt das Feld nochmal durch)
  for(let r=0;r<8;r++) for(let c=0;c<10;c++){const x=64+c*64+(r%2?32:0)+(variant===0?16:0); if(x>=90&&x<=TW-90) peg(x,3950+r*90,9,PAL.bump)}
  for(let i=0;i<4;i++){const left=(i+variant)%2===0; wall(left?260:TW-260,4850+i*260,440,22,left?0.12:-0.12,PAL.ramp)}
  // 5) Bumper + feine Stifte
  for(let r=0;r<5;r++) for(let c=0;c<4;c++){const x=120+c*150+(r%2?75:0); if(x>=110&&x<=TW-110) peg(x,6000+r*160,22+rand()*5,PAL.bump)}
  for(let r=0;r<4;r++) for(let c=0;c<11;c++){const x=48+c*56+(r%2?28:0); if(x>=90&&x<=TW-90) peg(x,6900+r*80,6,PAL.peg)}
  // 6) Trichter
  wall(150,7500,300,24,0.62,PAL.fun); wall(TW-150,7500,300,24,-0.62,PAL.fun);
  wall(TW/2-46,7750,20,200,0,PAL.fun); wall(TW/2+46,7750,20,200,0,PAL.fun);
  wall(TW/2,WORLD_H-20,TW,40);
  return [S,sp];
}

function bakeTrack(){ // statische Teile einmal vorzeichnen (spart viel Rechenzeit pro Bild)
  trackLayer = document.createElement('canvas'); trackLayer.width = TW; trackLayer.height = WORLD_H;
  const g = trackLayer.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=2;
  for(let y=0;y<WORLD_H;y+=120){g.beginPath();g.moveTo(0,y);g.lineTo(TW,y);g.stroke()}
  for(let i=0;i<13;i++){g.fillStyle=i%2?'#fff':'#111'; g.fillRect(i*48,FINISH_Y,48,14)}
  g.font='700 36px "DejaVu Sans"'; g.fillStyle='rgba(255,255,255,0.25)'; g.textAlign='center'; g.fillText('FINISH',TW/2,FINISH_Y-20);
  for(const s of statics) if(!s.gate && !s.spin) drawBody(g,s);   // Paddel drehen sich, werden live gezeichnet
}

function addBall(code, players, i){
  const pos = i===undefined ? {x:60+rand()*488, y:40} : {x:60+(i%12)*44+rand()*4, y:100+Math.floor(i/12)*44};
  const b = Bodies.circle(pos.x, pos.y, R, {restitution:0.45, friction:0.005, frictionAir:0.004, density:0.002});
  Object.assign(b,{code, flag:flagOf(code), name:NAME[code]||code, players:players.slice(), still:0, trail:[]});
  balls.push(b); Composite.add(engine.world,b); return b;
}

async function newRace(){
  raceNo++; trackSeed = (Date.now()/1000|0);
  PAL = PALETTES[raceNo % PALETTES.length];
  rand = seedRand(1000+trackSeed%100000);
  let lu;
  try { lu = OFFLINE ? null : await (await fetch('/api/lineup')).json(); } catch { lu = null; }
  if(!lu) lu = COUNTRY_LIST.slice(0,200).sort(()=>rand()-0.5).slice(0,30).map(c=>({code:c[0],players:[]}));
  engine = Engine.create({gravity:{y:1.3}, positionIterations:8, velocityIterations:6});
  [statics,spinners] = buildTrack(raceNo % 3);
  bakeTrack();
  Composite.add(engine.world, statics);
  balls = [];
  lu.slice().sort(()=>rand()-0.5).forEach(({code,players},i)=>addBall(code,players,i));
  Events.on(engine,'collisionStart',onHit);
  t=0; finished=[]; phase='countdown'; phaseT=0; nextUp=[]; leader=null;
}

function step(){
  phaseT++;
  for(const o of toasts) o.t++;
  toasts = toasts.filter(o=>o.t<o.life);
  for(const s of spinners) Body.setAngle(s, s.angle+s.spin);
  if(phase==='countdown'){
    if(phaseT%60===0 && phaseT<START_WAIT) sfx.beep(phaseT>=START_WAIT-60?880:440);
    if(phaseT>=START_WAIT){ phase='race'; phaseT=0; sfx.go(); const g=statics.find(s=>s.gate); Composite.remove(engine.world,g); statics=statics.filter(s=>!s.gate)}
  }
  Engine.update(engine, 1000/60);
  if(phase!=='race' && phase!=='podium') return;
  t++;
  // Spannung: wer weit vorne allein fährt, bekommt etwas mehr Luftwiderstand (Feld bleibt zusammen)
  if(phase==='race'){ const run=balls.filter(b=>!b.done).sort((a,b)=>b.position.y-a.position.y);
    run.forEach((b,i)=>{ const gap=i<3&&run[4]?b.position.y-run[4].position.y:0; b.frictionAir=0.004+Math.min(Math.max(gap-200,0)/800,1)*0.022 }) }
  for(const b of balls){
    if(b.done) continue;
    if(b.position.y>FINISH_Y){
      b.done=true; finished.push(b); const k=finished.length;
      if(k<=3){ sfx.finish(k); if(b.players.length && phase==='race') toast(`🏁 ${b.players[0]} finished #${k} with ${b.flag}!`, '#4ade80') }
      if(k===3) thirdT=t }
    b.still = b.speed<0.25 ? b.still+1 : 0;
    if(b.still>120){Body.setVelocity(b,{x:Math.sign(TW/2-b.position.x)*(3+Math.random()*3),y:-5}); b.still=0}   // zur Mitte schubsen
  }
  if(phase==='race' && t>60*3 && t%15===0){ const l=ranking()[0];
    if(l && l!==leader){ if(leader){ toast(`${l.flag} ${l.name} takes the lead!`+(l.players.length?` (${l.players[0]})`:''), '#fde047', 150); sfx.lead() } leader=l } }
  if(phase==='race' && (finished.length===balls.length || t>60*150 || (finished.length>=3 && t-thirdT>60*10))){   // Nachzügler nicht ewig abwarten
    phase='podium'; phaseT=0; sfx.fanfare(); toasts=[];
    const w=finished[0];
    if(w && !OFFLINE) fetch('/api/result',{method:'POST',body:JSON.stringify({winner:w.code,players:w.players})})
      .then(r=>r.json()).then(b=>board=b).catch(()=>{});
  }
  if(phase==='podium' && phaseT>60*8){ if(reloadPending){ location.reload(); phase='loading'; return } phase='loading'; newRace()}
}

// ---------- Chat ----------
function toast(s, col='#fde047', life=240){ toasts.push({s,col,t:0,life}); if(toasts.length>3) toasts.shift() }
async function pollChat(){
  if(OFFLINE) return;
  try{
    const r = await (await fetch('/api/events?since='+lastEv)).json();
    if(lastEv<0){ lastEv=r.last; return }          // alte Beitritte beim Laden nicht nochmal zeigen
    for(const e of r.events){
      const flag=flagOf(e.code), nm=NAME[e.code]||e.code;
      let b = balls && balls.find(x=>x.code===e.code);
      if(!b && phase==='countdown' && balls.length<MAX_BALLS) b = addBall(e.code, []);   // vor dem Start: sofort eigene Kugel
      if(b && (phase==='countdown'||phase==='race')){
        if(!b.players.includes(e.user)) b.players.unshift(e.user);
        toast(`${flag} ${e.user} is racing for ${nm}!`, '#4ade80'); chatLog.unshift({user:e.user,flag,txt:'racing now'});
      } else {
        nextUp = nextUp.filter(x=>x.user!==e.user); nextUp.push({user:e.user, code:e.code});
        toast(`${flag} ${e.user} is IN the next race!`, '#fde047'); chatLog.unshift({user:e.user,flag,txt:'next race'});
      }
      sfx.join();
    }
    chatLog = chatLog.slice(0,6); lastEv = r.last;
  }catch{}
}
let myVersion=null, reloadPending=false;
async function pollVersion(){ if(OFFLINE) return; try{ const v=(await (await fetch('/api/version')).json()).v; if(myVersion===null) myVersion=v; else if(v!==myVersion) reloadPending=true }catch{} }
async function pollBoard(){ if(!OFFLINE) try{ board = await (await fetch('/api/board')).json() }catch{} }

// ---------- Ton ----------
const AC = new (window.AudioContext||window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
const sfxBus = AC.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
function tone(f, d=0.12, type='sine', v=0.3, when=0){
  const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+when;
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(v,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t0+d); o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0+d+0.02);
}
const SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5]; let hitBudget=0;
const sfx = {
  beep:f=>tone(f,0.25,'square',0.25), go:()=>{tone(1046,0.5,'square',0.3);tone(1318,0.5,'square',0.2,0.05)},
  plink:(y)=>{ if(hitBudget<=0) return; hitBudget--; tone(SCALE[Math.floor(Math.random()*SCALE.length)]*(y>5500?0.5:1),0.18,'triangle',0.12)},
  join:()=>{tone(1318,0.08,'sine',0.2);tone(1760,0.12,'sine',0.2,0.07)},
  lead:()=>{tone(784,0.1,'square',0.2);tone(1175,0.18,'square',0.2,0.08)},
  finish:k=>tone([0,1046,880,784][k],0.35,'triangle',0.35),
  fanfare:()=>[523,659,784,1046].forEach((f,i)=>tone(f,i===3?0.8:0.18,'square',0.22,i*0.14)),
};
setInterval(()=>hitBudget=6, 250);   // höchstens ~24 Pling-Töne pro Sekunde
function onHit(ev){ if(phase!=='race') return; for(const p of ev.pairs){ const s=p.bodyA.isStatic?p.bodyA:p.bodyB.isStatic?p.bodyB:null; if(s&&s.peg) sfx.plink(s.position.y) } }
// Musik-Playlist (Dateien in /var/lib/marble/music), leiser unter den Effekten
const music = new Audio(); music.volume = 0.55; let playlist = [], pi = 0;
const mnode = AC.createMediaElementSource(music); mnode.connect(master);
music.onended = ()=>playNext(); music.onerror = ()=>setTimeout(playNext, 3000);
async function playNext(){ try{ if(!playlist.length) playlist = await (await fetch('/api/music')).json() }catch{}
  if(!playlist.length){ setTimeout(playNext, 30000); return }
  if(pi % playlist.length === 0) playlist.sort(()=>Math.random()-0.5);
  music.src = '/music/'+encodeURIComponent(playlist[pi++ % playlist.length]); music.play().catch(()=>setTimeout(playNext,3000)) }

// ---------- Darstellung ----------
function flagBall(x,y,r,b,g=ctx){
  g.save(); g.beginPath(); g.arc(x,y,r,0,7); g.closePath(); g.clip();
  g.fillStyle='#fff'; g.fillRect(x-r,y-r,2*r,2*r);
  g.font=`${r*2.9}px "Noto Color Emoji"`; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(b.flag,x,y+r*0.12);
  const gr=g.createRadialGradient(x-r*0.4,y-r*0.45,r*0.1,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,0.75)'); gr.addColorStop(0.35,'rgba(255,255,255,0.05)'); gr.addColorStop(1,'rgba(0,0,0,0.35)');
  g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); g.restore();
  g.lineWidth=Math.max(2,r/9); g.strokeStyle='rgba(255,255,255,0.85)'; g.beginPath(); g.arc(x,y,r,0,7); g.stroke();
}
// Flaggen-Kugeln als Bild vorbereiten (Emoji-Text ist teuer)
const ballImg = new Map();
function ballSprite(b,r){
  const k=b.code+r; if(ballImg.has(k)) return ballImg.get(k);
  const c=document.createElement('canvas'); c.width=c.height=2*r+6; flagBall(r+3,r+3,r,b,c.getContext('2d')); ballImg.set(k,c); return c;
}
const flagSprite = (code,r)=>ballSprite({code,flag:flagOf(code)},r);
function drawBody(g,b,flat){
  g.fillStyle=b.col; g.shadowColor=b.col; g.shadowBlur=flat?0:18;
  g.beginPath(); const v=b.vertices;
  if(b.circleRadius){g.arc(b.position.x,b.position.y,b.circleRadius,0,7)}
  else {g.moveTo(v[0].x,v[0].y); for(const p of v) g.lineTo(p.x,p.y); g.closePath()}
  g.fill(); g.shadowBlur=0;
}
function ranking(){
  const rest=balls.filter(b=>!b.done).sort((a,b)=>b.position.y-a.position.y);
  return [...finished,...rest];
}
// Text; maxW > 0 verkleinert die Schrift, bis er hineinpasst. outline = dunkler Rand (lesbar über der Bahn)
function txt(s,x,y,size,col='#fff',w='700',al='left',maxW=0,outline=false){
  ctx.font=`${w} ${size}px "DejaVu Sans"`;
  if(maxW){ const m=ctx.measureText(s).width; if(m>maxW) ctx.font=`${w} ${Math.floor(size*maxW/m)}px "DejaVu Sans"` }
  ctx.textAlign=al; ctx.textBaseline='alphabetic';
  if(outline){ ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineJoin='round'; ctx.strokeText(s,x,y) }
  ctx.fillStyle=col; ctx.fillText(s,x,y)}
function box(x,y,w,h,fill,r=12,stroke){ ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); if(stroke){ctx.lineWidth=3; ctx.strokeStyle=stroke; ctx.stroke()} }
const who = b => b.players.length ? b.players[0] + (b.players.length>1?` +${b.players.length-1}`:'') : '';
const MID = CX+CW/2, secs = n=>Math.max(0,Math.ceil(n/60));

function draw(){
  ctx.setTransform(SC,0,0,SC,0,0);
  const rank=ranking(), lead=rank.find(b=>!b.done)||rank[rank.length-1];
  const target=Math.min(Math.max(lead.position.y-H*0.62,-250),WORLD_H-H);   // -250: Startgitter sichtbar unter dem Aufruf-Balken   // Kamera immer auf dem Ersten (Niklas)
  camY += (target-camY)*0.12;
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,PAL.bg[0]); bg.addColorStop(1,PAL.bg[1]);
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // Bahn in der Mittelspalte
  { const sy=Math.max(0,Math.round(camY)), dy=sy-Math.round(camY); ctx.drawImage(trackLayer,0,sy,TW,H-dy,CX,dy,TW,H-dy) }
  ctx.save(); ctx.beginPath(); ctx.rect(CX,0,CW,H); ctx.clip(); ctx.translate(CX,-camY);
  for(const s of spinners) drawBody(ctx,s,true);
  for(const s of statics) if(s.gate) drawBody(ctx,s);
  for(const b of balls){ b.trail.push({x:b.position.x,y:b.position.y}); if(b.trail.length>14) b.trail.shift() }
  if(phase==='race') rank.slice(0,3).forEach((b,i)=>{ctx.strokeStyle=['#ffd700','#d1d5db','#cd7f32'][i]; ctx.lineWidth=7; ctx.globalAlpha=0.5;
    ctx.beginPath(); b.trail.forEach((p,j)=>j?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke(); ctx.globalAlpha=1});
  for(const b of balls){
    if(b.position.y<camY-40||b.position.y>camY+H+40) continue;
    if(b.players.length){ ctx.strokeStyle='#fde047'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(b.position.x,b.position.y,R+4,0,7); ctx.stroke() }
    const sp=ballSprite(b,R); ctx.save(); ctx.translate(b.position.x,b.position.y); ctx.rotate(b.angle); ctx.drawImage(sp,-R-3,-R-3); ctx.restore();
  }
  for(const b of balls) if(b.players.length && b.position.y>camY-40 && b.position.y<camY+H+40)
    txt(who(b),Math.min(Math.max(b.position.x,70),TW-70),b.position.y-R-10,22,'#fde047','700','center',150,true);
  ctx.restore();
  drawColumn(rank); drawLeft(); drawRight(rank);
}

// Mittelspalte = 9:16-Bild: Kopf, Ansagen, Countdown/Sieger, Fuß mit Mitmach-Aufruf
function drawColumn(rank){
  const L=CX+20, Rt=CX+CW-20;
  ctx.fillStyle='rgba(8,10,24,0.86)'; ctx.fillRect(CX,0,CW,128);
  box(L,18,92,40,'#ef4444',8); txt('LIVE',L+46,47,24,'#fff','700','center');
  txt('COUNTRY MARBLE RACE',L+108,49,30,'#fff','700','left',CW-150);
  txt(`RACE #${raceNo}`,L,104,26,'#94a3b8');
  txt(phase==='race'?`⏱ ${(t/60).toFixed(0)}s`:phase==='countdown'?`⏳ ${secs(START_WAIT-phaseT)}s`:'🏁',Rt,104,26,'#22d3ee','700','right');
  rank.slice(0,3).forEach((b,i)=>{ const x=MID-105+i*80; txt(['1','2','3'][i],x,104,22,['#ffd700','#d1d5db','#cd7f32'][i],'700','center'); ctx.drawImage(ballSprite(b,16),x+12,78) });
  // Mitmach-Aufruf oben (unten und rechts verdeckt am Handy die YouTube-Oberfläche/der Chat), im Wechsel mit „Next race: …“
  const F=128, showNext = nextUp.length && phase==='race' && Math.floor(Date.now()/5000)%2===1;
  const fg=ctx.createLinearGradient(0,F,0,F+110); fg.addColorStop(0,'rgba(146,64,14,0.95)'); fg.addColorStop(1,'rgba(69,26,3,0.95)');
  ctx.fillStyle=fg; ctx.fillRect(CX,F,CW,110); ctx.fillStyle='#fde047'; ctx.fillRect(CX,F+106,CW,4);
  if(showNext){
    txt('⏭ NEXT RACE',MID,F+44,34,'#fde047','700','center');
    txt(nextUp.slice(-4).map(x=>`${flagOf(x.code)} ${x.user}`).join('  '),MID,F+88,28,'#fff','700','center',CW-40);
  } else {
    txt('🎯 GET YOUR OWN BALL!',MID,F+48,44,'#fde047','700','center',CW-40);
    txt('type your COUNTRY in the chat',MID,F+92,32,'#fff','700','center',CW-40);
  }
  // Ansagen mit Benutzernamen
  toasts.forEach((o,i)=>{ const y=252+i*62; ctx.globalAlpha=Math.min(1,o.t/8,(o.life-o.t)/20);
    box(CX+14,y,CW-28,52,'rgba(5,6,18,0.88)',14,o.col); txt(o.s,MID,y+36,26,o.col,'700','center',CW-64); ctx.globalAlpha=1 });
  if(phase==='countdown'){
    const n=secs(START_WAIT-phaseT), mine=balls.filter(b=>b.players.length);
    const oy=Math.max(238,Math.round(320-camY)); ctx.fillStyle='rgba(5,6,18,0.5)'; ctx.fillRect(CX,oy,CW,H-oy);   // Kugeln am Start nicht abdunkeln
    txt(n>0?String(n):'GO!',MID,745,170,'#fde047','700','center');
    txt('Type your COUNTRY in the chat 👇',MID,815,34,'#fff','700','center',CW-40,true);
    txt('→ your flag races with YOUR name on it',MID,858,26,'#fde047','700','center',CW-40,true);
    txt('e.g.  Brazil · USA · Germany · 🇯🇵',MID,898,24,'#cbd5e1','400','center',CW-40);

  }
  if(phase==='podium'||phase==='loading'){
    const a=Math.min(phaseT/30,1), w=finished[0]; ctx.fillStyle=`rgba(5,6,18,${0.82*a})`; ctx.fillRect(CX,238,CW,H-238);
    ctx.globalAlpha=a; txt('🏆 WINNER',MID,300,54,'#ffd700','700','center');
    if(w){ flagBall(MID,430,95,w); txt(w.name,MID,580,56,'#fff','700','center',CW-40);
      if(w.players.length) txt(`🎉 ${w.players[0]} WINS!`,MID,636,42,'#fde047','700','center',CW-40);
      else txt(`Type ${w.name.toUpperCase()} in chat to claim it!`,MID,636,28,'#cbd5e1','700','center',CW-40) }
    [1,2].forEach(k=>{const b=finished[k]; if(!b) return; const x=MID+(k===1?-150:150);
      flagBall(x,740,42,b); txt(`${k+1}. ${b.name}`,x,816,24,'#e5e7eb','700','center',260);
      if(b.players.length) txt(b.players[0],x,846,20,'#fde047','400','center',260)});
    const top=(board.countries||[])[0];
    if(top) txt(`Most wins today: ${flagOf(top[0])} ${NAME[top[0]]||top[0]} (${top[1]})`,MID,920,26,'#94a3b8','700','center',CW-40);
    ctx.globalAlpha=1;
  }
}

// ---------- Takt ----------
let acc=0, last=performance.now(), fpsN=0, fpsT=last; window.fps=0;
function loop(now){
  acc += Math.min(now-last, 250); last=now;
  let n=0; while(acc>=1000/60 && n<6){ if(phase!=='loading') step(); acc-=1000/60; n++ }
  if(acc>1000/60) acc=0;                   // zu langsam: lieber Zeit verlieren als ruckeln
  if(phase!=='loading') draw();
  fpsN++; if(now-fpsT>2000){ window.fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now }
  requestAnimationFrame(loop);
}
const origNew = newRace;
newRace = async()=>{ phase='loading'; await origNew() };
document.fonts.load('40px "Noto Color Emoji"','🇩🇪').then(async()=>{
  await newRace(); setInterval(pollChat,1000); setInterval(pollBoard,5000); pollBoard(); pollVersion(); setInterval(pollVersion,30000);
  AC.resume(); playNext(); requestAnimationFrame(loop);
});
