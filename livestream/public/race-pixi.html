const W = 1920, H = 1080, CW = 608, CX = (W-CW)/2, TW = CW, R = 17, FINISH_Y = 7900, WORLD_H = 8200, START_WAIT = 60*8, MAX_BALLS = 48;
const Q = new URLSearchParams(location.search), OFFLINE = Q.has('offline'), ZOOM_OFF = Q.get('zoom')==='0';
// Glas-Look wie Wortraten (Niklas 09.10.): dunkel-lila, kompakte Glas-Kästen mittig, Inter. Standard seit 09.10. (Niklas „passt geh live“), alte Fassung per ?style=classic

if(GLASS){ const ff=new FontFace('Inter','url(/fonts/InterVariable.woff2)',{weight:'100 900'}); ff.load().then(f=>document.fonts.add(f)).catch(()=>{}) }
// Farben der klassischen Fassung → Wortraten-Palette (Bahn unverändert)
const GMAP = {'#94a3b8':'#a99fc6','#64748b':'#6c6390','#cbd5e1':'#c9c0e3','#e2e8f0':'#e6e0f7','#e5e7eb':'#e6e0f7','#22d3ee':'#4fe0c0','#fde047':'#ffd166','#ffd700':'#ffd166','#ef4444':'#ff5d8d','#4ade80':'#4fe0c0','#f9a8d4':'#ff8fb1'};
const gc = c => GLASS && GMAP[c] || c;
// Neo-Brutalism wie Wortraten (Niklas 09.10. Vorschau): ?style=brutal, immer dunkel wie Wortraten (Niklas: kein Tag/Nacht-Wechsel); ?light=1 = helle Fassung
const BRUTAL = Q.get('style')==='brutal', BDARK = Q.get('light')!=='1';
// dunkel v3 wie Wortraten (Gemini 09.10.): schwarze Schatten, hellerer Lila-Grund, weichere Farben, helle statt cremefarbene Flächen
const BK='#111', PAPER=BDARK?'#2f2858':'#fff7e0', CARDC=BDARK?'#f8f4eb':'#fff', SHC=BDARK?'#000':'#111', BY=BDARK?'#fed439':'#ffd23f', BP=BDARK?'#ff7b9c':'#ff6fb5', BC=BDARK?'#61d4f5':'#3ee0ff', BL='#b6f36a', BO='#ff8a3d', BTS=BDARK?'#ff4b72':'#ff6fb5';
let BINK=false;   // true = Text steht auf heller Karte → dunkle Schrift
const BINKS={'#f3effc':'#111','#fff':'#111','#ffffff':'#111','#e6e0ff':'#111','#e6e0f7':'#222','#c9c0e3':'#333','#a99fc6':'#555','#6c6390':'#777','#22182e':'#111'};
const BDK={'#4fe0c0':'#0a7a50','#ffd166':'#9a6400','#9b82ff':'#5b2fd6','#ff5d8d':'#c8104f','#ff8fb1':'#c8104f','#67e8f9':'#086f8a','#c4b5ff':'#5b2fd6','#ffb627':'#9a6400','#ffd2bd':'#b04a00'};
const bcol = c => !BRUTAL || (BDARK && !BINK) ? c : BINKS[c] || BDK[c] || c;
function hardBox(x,y,w,h,fill,r=14,lw=5,sh=10,shc=SHC){ ctx.fillStyle=shc; ctx.beginPath(); ctx.roundRect(x+sh,y+sh,w,h,r); ctx.fill();
  ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle=BK; ctx.stroke() }
const inkOn = f => { const pb=BINK; BINK=true; try{ f() } finally { BINK=pb } };
const OUT_W = +(Q.get('w')||1280), SC = OUT_W/W;     // Ausgabe 1280x720 spart ~55 % Rechenzeit gegenüber 1080p
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = OUT_W; cv.height = Math.round(H*SC);
const NAME = Object.fromEntries(COUNTRY_LIST.map(c=>[c[0],c[1]]));

let engine, balls, statics, spinners, t, finished, raceNo = 0, phase, phaseT, chatLog = [], camY = 0, camX = 0, camZ = 1, trackLayer, trackSeed = 0, rand;
let thirdT = 0, leader = null, lastEv = -1, board = {races:0, countries:[], players:[], fans:[]}, nextUp = [], toasts = [];

function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}   // fair mischen (sort(()=>rand()-0.5) bevorzugt manche Plätze)
function seedRand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

// ---------- Bahn: jedes Rennen neu aus Bausteinen gewürfelt (Zufall aus rand(), pro Rennen neu geseedet) ----------
const PALETTES = [
  // Jahrmarkt, aber harmonisch (Niklas 06.10.): je Bahn drei abgestimmte Farben statt fünf Neonfarben
  {peg:'#ffd166', ramp:'#ef476f', paddle:'#fff1d0', bump:'#ffd166', fun:'#ef476f', bg:['#1c0f22','#120a1a']},   // Karussell: Gold, Kirschrot, Creme
  {peg:'#ffc8dd', ramp:'#7fd1e8', paddle:'#ffd166', bump:'#ffc8dd', fun:'#7fd1e8', bg:['#151634','#1c1032']},   // Zuckerwatte: Rosa, Himmelblau, Gold
  {peg:'#ffd166', ramp:'#2ec4b6', paddle:'#ff8c61', bump:'#ffd166', fun:'#2ec4b6', bg:['#0d1b2a','#0f1630']},   // Riesenrad: Gold, Türkis, Koralle
];
if(GLASS) PALETTES.splice(0,3,   // Wortraten-Farben: Lila, Mint, Pink, Gold auf dunklem Lila
  {peg:'#b6a4ff', ramp:'#5b48c9', paddle:'#38b59c', bump:'#ffd166', fun:'#ff5d8d', bg:['#1a1433','#120d24']},
  {peg:'#ff8fb1', ramp:'#2f9e8a', paddle:'#e0b45a', bump:'#ff8fb1', fun:'#9b82ff', bg:['#1a1433','#120d24']},
  {peg:'#ffd166', ramp:'#b8466b', paddle:'#7a63d9', bump:'#ffd166', fun:'#4fe0c0', bg:['#1a1433','#120d24']});
if(BRUTAL) PALETTES.splice(0,3,   // flache Knallfarben auf dunkler Bahn
  {peg:BY, ramp:BP, paddle:BC, bump:BY, fun:BL, bg:['#241c4f','#1b1440']},
  {peg:BC, ramp:BL, paddle:BP, bump:BC, fun:BY, bg:['#241c4f','#1b1440']},
  {peg:BL, ramp:BO, paddle:BC, bump:BL, fun:BP, bg:['#241c4f','#1b1440']});
let PAL = PALETTES[0];
// Bausteine: jeder bekommt die Start-Höhe y und baut nach unten; Rückgabe = verbrauchte Höhe.
// Regeln: Abstand zur Wand und zwischen Hindernissen ≥ 2 Kugeldurchmesser, sonst klemmen Kugeln.
const MODULES = {
  pegs(T,y){ const sp=56+Math.floor(rand()*16), rows=7+Math.floor(rand()*4), r=6+rand()*4, off=rand()*sp;
    T.noses(y+40+(sp+28)/2, y+rows*(sp+28), 2*(sp+28));
    for(let i=0;i<rows;i++) for(let x=off+(i%2?sp/2:0);x<TW;x+=sp) if(x>=90&&x<=TW-90) T.peg(x,y+40+i*(sp+28),r,PAL.peg);
    return rows*(sp+28)+80 },
  zigzag(T,y){ const n=4+Math.floor(rand()*3), gap=220+rand()*60, ang=0.13+rand()*0.08, first=rand()<0.5;
    for(let i=0;i<n;i++){ const left=(i%2===0)===first; T.wall(left?260:TW-260,y+80+i*gap,440,22,left?ang:-ang,PAL.ramp) }
    return n*gap+120 },
  paddles(T,y){ const rows=2+Math.floor(rand()*2), v=0.02+rand()*0.02;
    for(let i=0;i<rows;i++) for(let j=0;j<2;j++) T.spin(j?TW-180:180,y+120+i*290,200+rand()*20,18,((i+j)%2?1:-1)*(v+0.008*i),PAL.paddle);
    T.noses(y+265, y+rows*290, 290);
    return rows*290+120 },
  bumpers(T,y){ const rows=4+Math.floor(rand()*2), cols=4, dx=150;
    T.noses(y+160, y+rows*160, 320);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const x=120+c*dx+(r%2?75:0); if(x>=110&&x<=TW-110) T.peg(x,y+80+r*160,20+rand()*7,PAL.bump) }
    return rows*160+120 },
  funnel(T,y){ const g=200+rand()*40, w=(TW-80-g)/2, a=0.55+rand()*0.1, cx=TW/2+(rand()-0.5)*120;
    T.wall(40+w/2+(cx-TW/2)/2,y+120,w+40,22,a,PAL.fun); T.wall(TW-40-w/2+(cx-TW/2)/2,y+120,w+40,22,-a,PAL.fun);
    return 340 },
  windmill(T,y){ const two=rand()<0.5, v=(rand()<0.5?1:-1)*(0.04+rand()*0.02);
    const xs=two?[TW/2-150,TW/2+150]:[TW/2];
    for(const x of xs){ T.spin(x,y+200,two?200:300,18,v,PAL.paddle); T.spin(x,y+200,two?200:300,18,v,PAL.paddle,Math.PI/2) }
    T.noses(y+60, y+400, 170);
    return 440 },
  // Pendel-Hammer: schwingt quer über die Bahn und schlägt Kugeln zur Seite (Niklas 08.10.)
  pendulum(T,y){ const L=230+rand()*40, amp=0.9+rand()*0.25, per=150+Math.floor(rand()*50), ph=Math.floor(rand()*per);
    T.noses(y+120, y+420, 150);
    T.pend(TW/2, y+30, L, amp, per, ph, PAL.paddle);
    return L+150 },
  // Trampolin: zwei federnde, leicht zur Mitte geneigte Matten werfen Kugeln wieder hoch
  trampoline(T,y){ const a=0.26+rand()*0.06;
    for(const j of [0,1]){ const b=T.wall(j?TW-40-95:40+95, y+160, 190, 16, j?-a:a, PAL.bump); b.restitution=1.0; b.tramp=true }
    for(let r=0;r<2;r++) for(let c=0;c<3;c++) T.peg(TW/2-120+c*120+(r%2?60:0), y+330+r*110, 9, PAL.peg);
    return 520 },
  // Portal: wer in einen Ring rollt, kommt auf der anderen Bahnseite weiter unten wieder heraus
  portal(T,y){ const x1=120+rand()*60, dy=260+rand()*80;
    for(let r=0;r<2;r++) for(let c=0;c<5;c++){ const x=150+c*80+(r%2?40:0); if(x<=TW-110) T.peg(x, y+60+r*80, 7, PAL.peg) }
    T.portal(x1, y+260, TW-x1, y+260+dy); T.portal(TW-x1, y+200, x1, y+200+dy);
    return 300+dy },
  // Weiche: Trennwand in der Mitte, eine Seite schnell aber eng (Drehkreuz), die andere langsam aber sicher (Stifte)
  split(T,y){ const fast=rand()<0.5?0:1, L0=40, M=TW/2, H=480;
    T.wall(M, y+60, 70, 70, Math.PI/4, PAL.fun);   // Spitze oben verteilt auf beide Seiten
    T.wall(M, y+100+H/2, 18, H, 0, PAL.fun);
    for(const side of [0,1]){ const cx=side?(M+TW-L0)/2:(L0+M)/2;
      if(side===fast){ T.spin(cx, y+330, 150, 16, (side?-1:1)*0.05, PAL.paddle) }
      else for(let r=0;r<4;r++) for(const dx of (r%2?[0]:[-55,55])) T.peg(cx+dx, y+180+r*90, 8, PAL.peg) }
    return H+180 },
  // Schranke: zwei Hälften schließen im Takt, das Feld staut sich und startet eng beieinander neu (Niklas 08.10.)
  barrier(T,y){ const open=150+Math.floor(rand()*60), shut=80+Math.floor(rand()*40), ph=Math.floor(rand()*(open+shut));
    T.funnelIn(y+40);
    for(const j of [0,1]) T.door(j?TW-46:46, y+220, 258, j?-1:1, open, shut, ph, PAL.paddle);
    return 340 },
  slalom(T,y){ const n=4+Math.floor(rand()*3), gap=190+rand()*30;
    for(let i=0;i<n;i++){ const left=i%2===0; T.wall(left?40+140:TW-40-140,y+80+i*gap,300,22,left?0.32:-0.32,PAL.fun) }
    return n*gap+120 },
  flats(T,y){ const n=3+Math.floor(rand()*2), first=rand()<0.5;
    for(let i=0;i<n;i++){ const left=(i%2===0)===first; T.wall(left?260:TW-260,y+80+i*260,440,22,left?0.12:-0.12,PAL.ramp) }
    return n*260+80 },
};
const START_Y = 480, END_Y = 6850;
let trackName = '';
// Felder auf der Bahn: wer hineinrollt, wird kurz verändert (reiner Zufall, kein Land ist bevorzugt). 3 pro Rennen, je eins pro Streckendrittel.
const ZONES = {
  speed:  {icon:'⚡', name:'SPEED',  col:'#22d3ee', dur:0},     // einmaliger Schub nach unten
  mud:    {icon:'🟤', name:'MUD',    col:'#b45309', dur:60},    // einmal stark abbremsen (dauerhafte Reibung ließ Kugeln auf Rampen stehen bleiben)
  shrink: {icon:'🔻', name:'SHRINK', col:'#c084fc', dur:300},   // 5 s kleine Kugel (assist() skaliert), rutscht durch Engstellen
  bouncy: {icon:'🏀', name:'BOUNCE', col:'#f472b6', dur:210},   // 3,5 s Flummi
};
let zones = [], portals = [];
const PORTAL = {icon:'🌀', name:'PORTAL', col:'#a78bfa'};
function placeZones(){
  const types = shuffle(Object.keys(ZONES), rand), seg = (END_Y-START_Y-500)/3;
  zones = [0,1,2].map(i=>{ const w=170+rand()*70; return {type:types[i], x:50+rand()*(TW-100-w), y:START_Y+400+i*seg+rand()*(seg-140), w, h:110, id:i} });
}
// Feld betreten: Wirkung starten (jede Kugel löst jedes Feld höchstens einmal aus).
function enterZone(b, z){
  b.zHit=(b.zHit||0)|(1<<z.id); endFx(b);
  if(z.type==='speed'){ Body.setVelocity(b,{x:b.velocity.x*0.6, y:Math.min(Math.max(b.velocity.y,0)+8,17)}); b.boostT=45; b.boostBy=null }
  else { b.fx=z.type; b.fxT=ZONES[z.type].dur;
    if(z.type==='mud') Body.setVelocity(b,{x:b.velocity.x*0.25, y:b.velocity.y*0.25});
    if(z.type==='bouncy'){ b.rest0=b.restitution; b.restitution=0.95 } }
}
function endFx(b){ if(b.fx==='bouncy') b.restitution=b.rest0; b.fx=null; b.fxT=0 }
// Pro Takt für alle laufenden Kugeln: Wirkung herunterzählen, Felder prüfen. Gibt [Kugel, Feld]-Paare zurück (Töne/Toasts macht der Aufrufer)
function zoneStep(bs){
  const hits=[];
  for(const b of bs){ if(b.done) continue;
    if(b.fxT>0 && --b.fxT===0) endFx(b);
    if(!b.ported) for(const p of portals) if(Math.hypot(b.position.x-p.x1,b.position.y-p.y1)<p.r){ b.ported=true; Body.setPosition(b,{x:p.x2,y:p.y2}); Body.setVelocity(b,{x:b.velocity.x*0.5,y:Math.max(b.velocity.y,2)}); hits.push([b,{type:'portal'}]); break }
    for(const z of zones) if(!((b.zHit||0)&(1<<z.id)) && b.position.x>z.x && b.position.x<z.x+z.w && b.position.y>z.y && b.position.y<z.y+z.h){ enterZone(b,z); hits.push([b,z]) } }
  return hits;
}
// Bewegliche Teile pro Takt: Paddel drehen, Schranken fahren (tt = Takt seit Rennstart)
function moveParts(sp, tt){
  for(const s of sp){ if(s.spin){ Body.setAngle(s, s.angle+s.spin); continue }
    const d=s.slide; if(!d) continue;
    if(d.kind==='pend'){ const th=d.amp*Math.sin(2*Math.PI*(tt+d.ph)/d.per), dx=Math.sin(th), dy=Math.cos(th);
      Body.setPosition(s, {x:d.px+dx*d.off, y:d.py+dy*d.off}); if(!s.circleRadius) Body.setAngle(s, Math.atan2(dy,dx)); continue }
    const c=(tt+d.ph)%(d.open+d.shut), k=c<d.shut ? Math.max(0,1-c/15) : Math.min(1,(c-d.shut)/15);   // 0 = zu, 1 = offen (hängt an der Wand), 15 Takte Klappen
    const th=d.dir*k*Math.PI/2, ph=(d.dir>0?0:Math.PI)+th;
    Body.setAngle(s, th); Body.setPosition(s, {x:d.hx+Math.cos(ph)*d.len/2, y:d.hy+Math.sin(ph)*d.len/2}) }
}
function buildTrack(){
  const S = [], sp = [], N = []; portals = [];
  const T = {
    wall:(x,y,w,h,a=0,col='#1e293b')=>{const b=Bodies.rectangle(x,y,w,h,{isStatic:true,angle:a,friction:0.02,restitution:0.3});b.col=col;S.push(b);return b},
    peg:(x,y,r,col)=>{ if(N.some(n=>Math.hypot(n[0]-x,n[1]-y)<95+r)) return;   // keine Stifte direkt unter/neben einer Nase, sonst klemmt die Kugel
      const b=Bodies.circle(x,y,r,{isStatic:true,restitution:0.7});b.col=col;b.peg=true;S.push(b)},
    spin:(x,y,w,h,v,col,a0=0)=>{const b=Bodies.rectangle(x,y,w,h,{isStatic:true,restitution:0.4,angle:a0});b.col=col;b.spin=v;S.push(b);sp.push(b)},
    // Wand-Nasen: kurze Keile direkt an der Wand, schubsen Randläufer zur Mitte (sonst fallen sie am Rand an Stiften vorbei)
    noses:(y0,y1,step,left=rand()<0.5)=>{ for(let yy=y0;yy<y1;yy+=step){ const x=left?40+28:TW-40-28; T.wall(x,yy,72,16,left?0.6:-0.6,PAL.fun); N.push([x,yy]); left=!left } },
    funnelIn:(yy)=>{ T.wall(40+50,yy,120,18,0.5,PAL.fun); T.wall(TW-40-50,yy,120,18,-0.5,PAL.fun) },
    // Falltür: Scharnier an der Wand (dir 1 = links), klappt im Takt nach unten weg und wieder hoch
    pend:(px,py,L,amp,per,ph,col)=>{ for(const [off,body] of [[L/2,Bodies.rectangle(px,py+L/2,L,16,{isStatic:true,restitution:0.5})],[L,Bodies.circle(px,py+L,30,{isStatic:true,restitution:0.9})]]){ body.col=col; body.slide={kind:'pend',px,py,off,amp,per,ph}; S.push(body); sp.push(body) } },
    portal:(x1,y1,x2,y2)=>portals.push({x1,y1,x2,y2,r:34}),
    door:(hx,hy,len,dir,open,shut,ph,col)=>{const b=Bodies.rectangle(hx+dir*len/2,hy,len,18,{isStatic:true,restitution:0.3});b.col=col;b.slide={hx,hy,len,dir,open,shut,ph};S.push(b);sp.push(b)},
  };
  T.wall(20,WORLD_H/2,40,WORLD_H); T.wall(TW-20,WORLD_H/2,40,WORLD_H);
  // Startgitter (öffnet sich nach dem Countdown)
  const gate = T.wall(TW/2,300,TW-80,14,0,'#e2e8f0'); gate.gate = true;
  // Erst ein Stift-Feld (verteilt das Feld), dann zufällige Bausteine ohne direkte Wiederholung, bis die Strecke voll ist
  const keys=Object.keys(MODULES), used=['pegs'];
  let y = START_Y + MODULES.pegs(T, START_Y), last='pegs', ramps=0;
  const RAMPS=['zigzag','flats','slalom'];   // höchstens 2 Rampen-Bausteine, sonst wird das Rennen zäh (Simulation)
  while(true){
    const opts=keys.filter(k=>k!==last && k!=='barrier' && !(ramps>=2 && RAMPS.includes(k)) && !(last==='barrier' && (k==='flats'||k==='zigzag')));   // nach der Schranke sind die Kugeln langsam, flache Rampen würden sie stoppen
    const k=!used.includes('barrier') && y>(START_Y+END_Y)/2 ? 'barrier' : opts[Math.floor(rand()*opts.length)];   // genau eine Schranke, etwa in der Streckenmitte
    if(RAMPS.includes(k)) ramps++;
    if(y + 800 > END_Y) break;
    const before=S.length, spBefore=sp.length, h=MODULES[k](T,y);
    if(y+h > END_Y){ S.length=before; sp.length=spBefore; if(y+460<END_Y){ y+=MODULES.funnel(T,y); used.push('funnel') } break }
    y+=h; used.push(k); last=k;
  }
  trackName = used.join(' · ');
  // Schluss (fest): feine Stifte, Trichter, Zielkanal
  for(let r=0;r<4;r++) for(let c=0;c<11;c++){const x=48+c*56+(r%2?28:0); if(x>=90&&x<=TW-90) T.peg(x,6950+r*80,6,PAL.peg)}
  T.noses(6990, 7200, 160);
  // Offener Zieleinlauf (Niklas 08.10.): statt Trichter + engem Kanal ein paar Bumper über die volle Breite, Ziellinie über die ganze Bahn
  for(let r=0;r<3;r++) for(let c=0;c<4;c++){ const x=125+c*120+(r%2?60:0); if(x<=TW-110) T.peg(x,7380+r*150,16,PAL.bump) }
  T.noses(7450, 7800, 150);
  T.wall(TW/2,WORLD_H-20,TW,40);
  placeZones();
  return [S,sp];
}

function bakeTrack(){ // statische Teile einmal vorzeichnen (spart viel Rechenzeit pro Bild)
  trackLayer = document.createElement('canvas'); trackLayer.width = TW; trackLayer.height = WORLD_H;
  const g = trackLayer.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=2;
  for(let y=0;y<WORLD_H;y+=120){g.beginPath();g.moveTo(0,y);g.lineTo(TW,y);g.stroke()}
  for(let i=0;i<13;i++){g.fillStyle=i%2?'#fff':'#111'; g.fillRect(i*48,FINISH_Y,48,14)}
  if(GLASS){ g.font=`900 34px ${FONT}`; g.letterSpacing='8px'; g.fillStyle='rgba(243,239,252,0.32)'; g.textAlign='center'; g.fillText('FINISH',TW/2,FINISH_Y-22); g.letterSpacing='0px' }
  else { g.font='700 36px "DejaVu Sans"'; g.fillStyle='rgba(255,255,255,0.25)'; g.textAlign='center'; g.fillText('FINISH',TW/2,FINISH_Y-20) }
  for(const p of portals){ g.lineWidth=6; g.strokeStyle=PORTAL.col; g.globalAlpha=0.9;
    g.beginPath(); g.arc(p.x1,p.y1,p.r,0,7); g.stroke(); g.globalAlpha=0.25; g.fillStyle=PORTAL.col; g.fill();
    g.globalAlpha=0.6; g.setLineDash([8,6]); g.beginPath(); g.arc(p.x2,p.y2,p.r-6,0,7); g.stroke(); g.setLineDash([]); g.globalAlpha=1;
    g.font='34px "Noto Color Emoji"'; g.textAlign='center'; g.fillText('🌀',p.x1,p.y1+12) }
  for(const z of zones){ const Z=ZONES[z.type];
    g.globalAlpha=0.22; g.fillStyle=Z.col; g.fillRect(z.x,z.y,z.w,z.h); g.globalAlpha=0.9;
    g.strokeStyle=Z.col; g.lineWidth=3; g.setLineDash([10,7]); g.strokeRect(z.x,z.y,z.w,z.h); g.setLineDash([]);
    if(GLASS){ g.font=`800 19px ${FONT}`; g.letterSpacing='3px'; g.fillStyle='#f3effc'; g.textAlign='center'; g.fillText(Z.name,z.x+z.w/2,z.y+z.h-14); g.letterSpacing='0px' }
    else { g.font='700 22px "DejaVu Sans"'; g.fillStyle='#fff'; g.textAlign='center'; g.fillText(Z.name,z.x+z.w/2,z.y+z.h-14) }
    g.font='40px "Noto Color Emoji"'; g.fillText(Z.icon,z.x+z.w/2,z.y+54); g.globalAlpha=1 }
  for(const s of statics) if(!s.gate && !s.spin && !s.slide) drawBody(g,s);   // Paddel und Schranken bewegen sich, werden live gezeichnet
}

function addBall(code, players, i, bot){
  const pos = i===undefined ? {x:60+rand()*488, y:40} : {x:60+(i%12)*44+rand()*4, y:100+Math.floor(i/12)*44};
  const b = Bodies.circle(pos.x, pos.y, R, {restitution:0.75, friction:0.005, frictionAir:0.004, density:0.002});   // 0.75 = Flummi (Niklas), vorher 0.45
  Object.assign(b,{code, flag:flagOf(code), name:NAME[code]||code, players:players.slice(), still:0, trail:[], bot:bot||null});
  balls.push(b); Composite.add(engine.world,b); return b;
}

// Chaos-Rennen: jedes 10. Rennen des Tages mit Sonderregel, der Sieg zählt doppelt
const CHAOS=[{id:'moon',name:'🌙 MOON GRAVITY'},{id:'bounce',name:'🏀 SUPER BOUNCE'},{id:'quake',name:'🌋 EARTHQUAKE'},{id:'rocket',name:'🚀 ROCKET RACE'}];
let chaos=null, raceN=1;
const chaosLeft = ()=> (10 - raceN%10) % 10;      // 0 = dieses Rennen ist ein Chaos-Rennen
async function newRace(){
  raceNo++; trackSeed = (Date.now()/1000|0);
  PAL = PALETTES[raceNo % PALETTES.length];
  rand = seedRand(1000+trackSeed%100000);
  let lu;
  try { lu = OFFLINE ? null : await (await fetch('/api/lineup')).json(); } catch { lu = null; }
  if(!lu) lu = shuffle(COUNTRY_LIST.slice(0,200),rand).slice(0,30).map(c=>({code:c[0],players:[]}));
  engine = Engine.create({gravity:{y:1.3}, positionIterations:8, velocityIterations:6});
  [statics,spinners] = buildTrack();
  bakeTrack();
  Composite.add(engine.world, statics);
  balls = [];
  shuffle(lu.slice(),rand).forEach(({code,players,bot},i)=>addBall(code,players,i,bot));
  raceN = (board.races||0)+1; chaos = (!OFFLINE && chaosLeft()===0) ? CHAOS[Math.floor(Math.random()*CHAOS.length)] : null;
  if(chaos){ if(chaos.id==='moon') engine.gravity.y=0.75; if(chaos.id==='bounce') for(const b of balls) b.restitution=0.92; sfx.chaos() }
  Events.on(engine,'collisionStart',onHit);
  if(raceNo%50===0) reloadPending=true;   // alle 50 Rennen frisch laden (Speicher)
  if(finalMin()) toast(GLASS?'🔥 Final races of the hour!':'🔥 FINAL RACES of the hour – type your country!','#f87171',300);
  t=0; finished=[]; results=[]; slowT=-1; slowDone=false; timeScale=1; phase='countdown'; phaseT=0; nextUp=[]; leader=null; winAt=-1; comebackRank={};
  balls.forEach(b=>vload('win-'+b.code));
  if(chaos) say(['chaos',chaos.id,'double'],2);
  else if(finalMin() && saidFinal!==board.hourEnds){ saidFinal=board.hourEnds; say(['final-minutes'],2) }
  else say([['type-country','own-ball','get-ready'][raceNo%3]],2);
}

// Aufholjagd, sichtbar: der Führende trägt die Krone und wird größer, je weiter er allein vorne fährt (bleibt eher an Stiften hängen),
// die ersten drei bekommen dabei wie bisher etwas Luftwiderstand. Alle 5 s bekommt die hinterste Kugel im Bild einen Turbo (pro Kugel einmal je Rennen).
// Wird auch von der Simulation benutzt (gibt die Turbo-Kugel zurück, Töne/Toasts macht der Aufrufer).
const CROWN_MAX = 1.35, TURBO_EVERY = 60*5, TURBO_LEN = 80;
function assist(bs, tt, nFin){
  const run=bs.filter(b=>!b.done).sort((a,b)=>b.position.y-a.position.y);
  run.forEach((b,i)=>{ const gap=i<3&&run[4]?b.position.y-run[4].position.y:0; b.frictionAir=0.004+Math.min(Math.max(gap-200,0)/800,1)*0.022;
    b.crown = i===0 && !nFin;
    const want = (b.crown ? 1+Math.min(Math.max(gap-120,0)/500,1)*(CROWN_MAX-1) : 1)*(b.fx==='shrink'?0.7:1), cur=b.circleRadius/R;
    if(Math.abs(want-cur)>0.005){ const f=Math.min(Math.max(want/cur,0.992),1.008); Body.scale(b,f,f) }
    if(b.turboT>0){ b.turboT--; b.frictionAir=0.001; b.force.y += b.mass*0.0011;   // ~85 % mehr Schwerkraft
      if(b.velocity.y>17) Body.setVelocity(b,{x:b.velocity.x,y:17}) }
    if(b.pushT>0){ b.pushT--; b.frictionAir=0.001; b.force.y += b.mass*0.0009;   // Boost-Nachschub ~0,7 s
      if(b.velocity.y>17) Body.setVelocity(b,{x:b.velocity.x,y:17}) } });   // gedeckelt, sonst tunnelt sie durch Stifte
  if(tt<60*4 || tt%TURBO_EVERY || nFin || run.length<6) return null;
  const lead=run[0], cand=run.slice(3).filter(b=>!b.hadTurbo && lead.position.y-b.position.y<620);   // 620 ≈ was hinter dem Ersten noch im Bild ist
  const b=cand[cand.length-1]; if(!b) return null;
  b.hadTurbo=true; b.turboT=TURBO_LEN; Body.setVelocity(b,{x:b.velocity.x*0.5, y:Math.min(Math.max(b.velocity.y,0)+5,17)}); return b;
}

// Highlight-Clips (clips.js auf dem Server): wie spannend war das Rennen? Die besten werden als Short-Kandidaten mitgeschnitten.
let goAt=0, leadTimes=[];
function reportHighlight(w, s){
  if(OFFLINE) return;
  const gap=s ? s.ft-w.ft : 99, late=leadTimes.filter(x=>x>w.ft-60*5).length, dur=(performance.now()-goAt)/1000;
  let score=1, kind='race';
  if(slowDone){ score+=5; kind='photo' } else if(gap<=18) score+=3;
  if(chaos){ score+=3; if(kind==='race') kind='chaos' }
  if(w.hadTurbo){ score+=4; if(kind==='race') kind='turbo' }
  if((comebackRank[w.id]||0)>=6){ score+=2; if(kind==='race') kind='comeback' }
  score+=Math.min(late,3); if(w.players.length) score+=2; if(dur>34) score-=3;
  fetch('/api/highlight',{method:'POST',body:JSON.stringify({score, kind, goAgoMs:Math.round(performance.now()-goAt), dur:+dur.toFixed(1),
    winner:w.code, name:w.name, player:w.players[0]||'', chaos:chaos?chaos.id:'', race:raceNo})}).catch(()=>{});
}

function step(){
  phaseT++;
  for(const o of toasts) o.t++;
  toasts = toasts.filter(o=>o.t<o.life);
  moveParts(spinners, phase==='race' ? t : 0);
  if(phase==='countdown'){
    if(phaseT%60===0 && phaseT<START_WAIT) sfx.beep(phaseT>=START_WAIT-60?880:440);
    if(phaseT>=START_WAIT){ phase='race'; phaseT=0; sfx.go();
      for(const b of balls) if(b.players.length && carry[b.players[0]]){ b.charge=Math.min(3,(b.charge||0)+carry[b.players[0]]); delete carry[b.players[0]]; b.startPush=true } goAt=performance.now(); leadTimes=[]; say([raceNo%2?'off':'here-we-go'],2); const g=statics.find(s=>s.gate); Composite.remove(engine.world,g); statics=statics.filter(s=>!s.gate)}
  }
  Engine.update(engine, 1000/60);
  if(phase!=='race' && phase!=='podium') return;
  t++;
  if(phase==='race' && chaos){ const run=balls.filter(b=>!b.done);
    if(chaos.id==='quake' && t%(60*4)===0){ for(const b of run) Body.setVelocity(b,{x:b.velocity.x+(Math.random()-0.5)*14, y:b.velocity.y-Math.random()*4}); sfx.quake(); say(['quake']); toast('🌋 EARTHQUAKE!','#c084fc',90) }
    if(chaos.id==='rocket' && t%(60*3)===0 && run.length){ const b=run[Math.floor(Math.random()*run.length)]; Body.setVelocity(b,{x:b.velocity.x*0.6, y:Math.min(Math.max(b.velocity.y,0)+8,17)}); b.boostT=45; b.boostBy=null; sfx.boost() } }
  if(phase==='race'){ const tb=assist(balls, t, finished.length);
    if(tb){ sfx.turbo(); if(tb.players.length) toast(GLASS?`🔥 TURBO for ${tb.flag} ${short(tb.players[0])}!`:`🔥 TURBO for ${tb.flag} ${tb.name}! (${tb.players[0]})`,'#fb923c',120) }
    for(const [b,z] of zoneStep(balls)){ const Z=ZONES[z.type]||PORTAL; if(z.type==='speed') sfx.boost();
      if(b.players.length) toast(GLASS?`${Z.icon} ${short(b.players[0])} hit ${Z.name.toLowerCase()}!`:`${Z.icon} ${b.players[0]} hit ${Z.name}!`, Z.col, 120) } }
  if(phase==='race') for(const b of balls){ if(b.done || !(b.charge>0) || !b.players.length) continue;
    b.chargeCd=(b.chargeCd||0)-1; if(b.chargeCd>0) continue;
    const why = b.startPush && t>45 ? 'start' : b.still>30 ? 'stuck' : b.position.y>FINISH_Y-1400 ? 'final' : null;
    if(why){ b.startPush=false; b.charge--; b.chargeCd=75; boost(b, b.players[0], why) } }
  // Bots boosten selbst, schwächer als ein Zuschauer: Rita 2× (wenn sie hängt / Zielgerade), Carl 1× gleich nach dem Start, Bob nie
  if(phase==='race') for(const b of balls){ if(b.done || !b.bot) continue;
    if(b.botLeft===undefined) b.botLeft={'Robo-Rita':2,'CPU-Carl':1}[b.bot]||0;
    b.chargeCd=(b.chargeCd||0)-1; if(!(b.botLeft>0) || b.chargeCd>0) continue;
    const why = b.bot==='CPU-Carl' && t>70 ? 'start' : b.still>30 ? 'stuck' : b.position.y>FINISH_Y-1400 ? 'final' : null;
    if(why){ b.botLeft--; b.chargeCd=75; boost(b, '🤖 '+b.bot, why, 0.7) } }
  // Zeitlupe, wenn die ersten zwei dicht beieinander auf die Ziellinie zurollen (einmal pro Rennen)
  if(phase==='race' && !slowDone && !finished.length){ const [a,c]=ranking();
    if(a && c && a.position.y>FINISH_Y-280 && a.position.y-c.position.y<2.5*R){ slowDone=true; slowT=0; sfx.slow() } }
  if(slowT>=0){ slowT++; if(slowT>55 || (finished.length>=2 && t-finished[1].ft>8) || phase!=='race') slowT=-1 }
  timeScale += ((slowT>=0 ? 0.4 : 1)-timeScale)*0.2;
  for(const b of balls){
    if(b.done) continue;
    if(b.position.y>FINISH_Y){
      b.done=true; b.ft=t; endFx(b); finished.push(b); const k=finished.length; if(k===1) winAt=t;
      if(k<=3) sfx.finish(k);
      if(b.players.length && phase==='race') { b.pts=ptsFor(k); if(balls.some(x=>x.bot) && !finished.some(x=>x.bot)){ b.beat=true; b.pts+=10 }
        toast(GLASS?(b.beat?`🏆 ${short(b.players[0])} beat the bots +${b.pts}`:`🏁 ${short(b.players[0])} #${k}  +${b.pts}`):b.beat?`🏆 ${b.players[0]} beat the bots! #${k}  +${b.pts} pts`:`🏁 ${b.flag} ${b.players[0]} #${k}/${balls.length}  +${b.pts} pts`, b.beat||k<=3?'#4ade80':'#e2e8f0', b.beat?240:undefined) }   // jeder Spieler erfährt seinen Platz (Niklas 06.10.)
      if(k===3) thirdT=t }
    b.still = b.speed<0.25 ? b.still+1 : 0;
    if(b.still>120){Body.setVelocity(b,{x:Math.sign(TW/2-b.position.x)*(3+Math.random()*3),y:-5}); b.still=0}   // zur Mitte schubsen
    if(b.position.x<-20 || b.position.x>TW+20 || b.position.y<-400){ Body.setPosition(b,{x:Math.min(Math.max(b.position.x,R+30),TW-R-30), y:Math.max(b.position.y,40)}); Body.setVelocity(b,{x:0,y:2}) }   // aus der Bahn gesprungen (selten, Flummi) → zurück
  }
  if(phase==='race' && t>60*3 && t%15===0){ const l=ranking()[0];
    if(l && l!==leader){ if(leader){ leadTimes.push(t); if(l.players.length||l.bot) toast(GLASS?`${l.flag} ${l.players.length?short(l.players[0]):'🤖 '+l.bot} takes the lead!`:`${l.flag} ${l.name} takes the lead!`+(l.players.length?` (${l.players[0]})`:` (🤖 ${l.bot})`), l.bot?BOT_COL:'#fde047', 150); sfx.lead();   // Flummi: viele Wechsel → Meldung höchstens alle 4 s (außer Spieler-Kugeln)
        say([(comebackRank[l.id]||0)>=6 ? 'comeback' : Math.random()<0.5 ? 'new-leader' : 'change-top']) } leader=l } }
  // Sprecher: Ränge von vor ein paar Sekunden (für „What a comeback!“), Zielgerade, Sieger
  if(phase==='race' && t%240===0){ comebackRank={}; ranking().forEach((b,i)=>comebackRank[b.id]=i) }
  if(phase==='race' && !finished.length && leader && leader.position.y>FINISH_Y-1300 && !leader.saidFin){ leader.saidFin=true; balls.forEach(b=>b.saidFin=true); say(['finish-coming'],2) }
  if(phase==='race' && t===60*7 && balls.some(b=>b.players.length)) say(['chat-boost']);
  if(winAt>=0 && (t-winAt>=20 || finished.length>=2)){ const w=finished[0], s=finished[1], photo=s && s.ft-w.ft<=18;
    say([...(photo?['photo']:[]), 'win-'+w.code, ...(chaos?['double']:[])], 3); winAt=-1; reportHighlight(w, s) }
  if(phase==='podium' && phaseT===60*5 && Math.random()<0.3) say(['what-a-race']);
  if(phase==='race' && (finished.length===balls.length || t>60*150 || (finished.length>=3 && t-thirdT>60*10))){   // Nachzügler nicht ewig abwarten
    phase='podium'; phaseT=0; sfx.fanfare(); toasts=[]; confetti(finished[0]&&finished[0].players.length?160:90);
    for(const b of balls) if(b.players.length && b.charge>0){ carry[b.players[0]]=Math.min(3,(carry[b.players[0]]||0)+b.charge); b.charge=0 }
    const w=finished[0], fin=ranking();
    // Ergebnis für jeden Spieler: Platz (auch wer noch nicht im Ziel war, nach Lage auf der Bahn) + bester Platz heute vom Server
    results = fin.map((b,i)=>({b, place:i+1})).filter(x=>x.b.players.length).map(x=>({user:x.b.players[0], flag:x.b.flag, place:x.place, done:x.b.done, pts:ptsFor(x.place)+(x.b.beat?10:0), beat:!!x.b.beat}));
    if(w && !OFFLINE) fetch('/api/result',{method:'POST',body:JSON.stringify({winner:w.code,players:w.players,double:!!chaos, total:balls.length, places:results.map(x=>({user:x.user,place:x.place,beatBots:x.beat}))})})
      .then(r=>r.json()).then(b=>{ board=b; for(const x of results){ const k=(b.best||{})[x.user]; if(k){ x.best=k.best; x.record=k.record && k.best!==null; x.points=k.points } } }).catch(()=>{});
  }
  if(phase==='podium' && phaseT>60*8){ if(reloadPending){ location.reload(); phase='loading'; return } phase='loading'; newRace()}
}

// ---------- Chat ----------
// CHEER-Schub: Kugel nach unten beschleunigen (gedeckelt, damit sie nicht durch Stifte tunnelt) + Funken
function boost(b, user, why, k=1){
  // jeder weitere Schub derselben Kugel im Rennen wirkt schwächer (große Fan-Gruppen gewinnen nicht automatisch)
  b.boosts=(b.boosts||0)+1; const dv=Math.max(2, 10.5*Math.pow(0.8, b.boosts-1))*(chaos&&chaos.id==='rocket'?1.5:1)*k;
  Body.setVelocity(b,{x:b.velocity.x*0.6, y:Math.min(Math.max(b.velocity.y,0)+dv,17)});
  b.boostT=60; b.pushT=Math.round(40*k); b.boostBy=user;   // Niklas 08.10.: Boost soll mehr bringen und klar sichtbar sein
  toast(GLASS?(why==='start'?`🚀 ${short(user)} start boost!`:why==='stuck'?`⚡ ${short(user)} boost: unstuck!`:`⚡ ${short(user)} BOOST!`):why==='start'?`🚀 ${user}'s saved boost: START PUSH!`:why==='stuck'?`⚡ ${user}'s boost frees ${b.flag} ${b.name}!`:`⚡ ${user}'s boost fires on the final stretch!`, '#22d3ee', 120); sfx.boost();
}
// Kommentator sagt den Boost an („Israel got a boost!“, Niklas 08.10.): höchstens alle 6 s, je Land alle 20 s
let lastBoostSay=0; const boostSaid={};
function sayBoost(code){ const now=Date.now(); if(!code || now-lastBoostSay<6000 || now-(boostSaid[code]||0)<20000) return;
  lastBoostSay=now; boostSaid[code]=now; vload('boost-'+code).then(b=>{ if(b) say(['boost-'+code],2) }) }   // ohne Clip still bleiben
const short=(u,n=12)=>{ u=String(u||''); return [...u].length>n?[...u].slice(0,n-1).join('')+'…':u };   // lange Namen kürzen statt abschneiden (Niklas 09.10.)
function fitTxt(s,size,maxW,w='800'){ ctx.font=`${w} ${size}px ${FONT}`; if(ctx.measureText(s).width<=maxW) return s; let a=[...s]; while(a.length>4 && ctx.measureText(a.join('')+'…').width>maxW) a.pop(); return a.join('').trimEnd()+'…' }
function toast(s, col='#fde047', life=240){ toasts.push({s,col,t:0,life}); if(toasts.length>2) toasts.shift() }
async function pollChat(){
  if(OFFLINE) return;
  try{
    const r = await (await fetch('/api/events?since='+lastEv)).json();
    if(lastEv<0){ lastEv=r.last;                   // alte Beitritte beim Laden nicht nochmal zeigen, aber die Liste wieder füllen
      try{ if(!chatLog.length) chatLog=(await (await fetch('/api/joined')).json()).map(j=>({user:j.user,flag:flagOf(j.code),ts:j.ts})) }catch{}
      return }
    for(const e of r.events){
      const flag=flagOf(e.code), nm=NAME[e.code]||e.code;
      const mine = balls && balls.find(x=>x.players.includes(e.user));
      // Schub nur für die eigene Kugel, auf der der Spieler seit dem Start sitzt
      // Boost-Ladung (Niklas 06.10.): Chat kommt ~25 s verzögert an, deshalb lädt jede Nachricht die eigene Kugel auf (max 3).
      // Die Ladung zündet von selbst, wenn die Kugel hängt oder auf der Zielgeraden ist; was übrig bleibt, wird Startschub im nächsten Rennen.
      if(e.cheer){ const tgt = mine && !(mine.done && phase==='race') && phase!=='podium' ? mine : null;
        if(tgt){ tgt.charge=Math.min(3,(tgt.charge||0)+1); toast(GLASS?`⚡ ${short(e.user)} boosted ${tgt.flag}  ${tgt.charge}/3`:`⚡ ${e.user} charged ${tgt.flag} ${tgt.name} (${tgt.charge}/3)`, '#22d3ee', 120) }
        else { carry[e.user]=Math.min(3,(carry[e.user]||0)+1); toast(GLASS?`⚡ ${short(e.user)}: boost saved  ${carry[e.user]}/3`:`⚡ ${e.user}: boost saved for the next race (${carry[e.user]}/3)`, '#22d3ee', 120) }
        sfx.charge(tgt?tgt.charge:carry[e.user]); sayBoost(tgt?tgt.code:e.code); continue }
      // Eigene Kugel pro Spieler (Niklas 06.10.): im Countdown sofort – freie Haus-Kugel des Landes übernehmen oder neue Kugel
      // (höchstens 6 pro Nation, 48 insgesamt); im Rennen erst ab dem nächsten (kein Aufspringen auf den Führenden)
      let b = null;
      if(phase==='countdown'){
        if(mine && mine.code===e.code) continue;
        b = balls.find(x=>x.code===e.code && !x.players.length && !x.bot);
        if(!b && balls.filter(x=>x.code===e.code).length<6 && balls.length<MAX_BALLS) b = addBall(e.code, []);
      }
      joinedAt[e.user] = joinedAt[e.user] || Date.now();
      if(b){
        if(mine) mine.players = [];                        // Länderwechsel: alte Kugel fährt als Haus-Kugel weiter
        b.players = [e.user];
        toast(GLASS?(e.back?`👋 ${short(e.user)} is back!`:`${flag} ${short(e.user)} joined the race!`):e.back?`👋 welcome back ${e.user}! ${flag} racing again`:`${flag} ${e.user} is racing for ${nm}!`, '#4ade80'); chatLog=chatLog.filter(c=>c.user!==e.user); chatLog.unshift({user:e.user,flag,txt:'racing now'});

// ---------- Jahrmarkt-Glanz (Niklas 06.10.: „bisschen bling bling wie am Jahrmarkt“) ----------
// Glühbirnen laufen ruhig im Kreis (kein hartes Blinken): jede dritte Birne gedimmt, Muster wandert langsam weiter.
function bulb(x,y,on){ ctx.fillStyle=on?'rgba(255,209,102,0.28)':'rgba(255,209,102,0.06)'; ctx.beginPath(); ctx.arc(x,y,on?8:5,0,7); ctx.fill();
  ctx.fillStyle=on?'#ffe9a8':'#7a5a2a'; ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill() }
function bulbRow(x,y,w,dir=0){ const n=Math.floor(w/22), k=Math.floor(Date.now()/220); for(let i=0;i<=n;i++) bulb(x+i*w/n,y,(i+(dir?-k:k)%3+300)%3!==0) }
function bulbRing(cx,cy,r,n){ const k=Math.floor(Date.now()/220); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; if(Math.sin(a)>0.8) continue; bulb(cx+Math.cos(a)*r,cy+Math.sin(a)*r,(i+k)%3!==0) } }   // unten frei für den Ländernamen
// sanftes Glimmen statt hartem Blinken (Schlussminuten, Chaos)
const glow=(a,b)=>{ const k=(1+Math.sin(Date.now()/450))/2; return `rgba(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')},0.95)` };
let conf=[];
function confetti(n){ const cols=BRUTAL?[BY,BP,BC,BL,BO]:GLASS?['#9b82ff','#4fe0c0','#ffd166','#ff5d8d','#f3effc']:PAL===PALETTES[1]?['#ffc8dd','#7fd1e8','#ffd166','#fff']:['#ffd166','#ef476f','#2ec4b6','#fff1d0','#ff8c61'];
  for(let i=0;i<n;i++) conf.push({x:CX+Math.random()*CW, y:280-Math.random()*300, vx:(Math.random()-0.5)*2, vy:1.5+Math.random()*2.5, a:Math.random()*6, va:(Math.random()-0.5)*0.3, s:6+Math.random()*6, c:cols[i%cols.length]}) }
function drawConfetti(){ if(!conf.length) return; ctx.save(); ctx.beginPath(); ctx.rect(CX,378,CW,H-378); ctx.clip();
  for(const p of conf){ p.x+=p.vx+Math.sin(p.a)*0.6; p.y+=p.vy; p.a+=p.va; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore() }
  ctx.restore(); conf=conf.filter(p=>p.y<H+20) }

// ---------- Takt ----------
let acc=0, last=performance.now(), lastDraw=0, fpsN=0, fpsT=last, tick=0, rafDt=16.7; window.fps=0;
function loop(now){
  rafDt += (Math.min(now-last,100)-rafDt)*0.05; acc += Math.min(now-last, 250)*timeScale; last=now;   // timeScale < 1 = Zeitlupe
  let n=0; while(acc>=1000/60 && n<6){ if(phase!=='loading') step(); acc-=1000/60; n++ }
  if(acc>1000/60) acc=0;                   // zu langsam: lieber Zeit verlieren als ruckeln
  // gleichmäßiger Takt (07.10.: Zeit-Drossel holte nach verspäteten Bildern auf → 6,5 % doppelte Bilder): bei 60 Hz strikt jedes zweite Bild zeichnen
  tick++; if(phase!=='loading' && (rafDt>24 || tick%2===0)){ lastDraw=now; draw(); fpsN++ }   // 30 Bilder/s reichen (ffmpeg greift 30 ab), spart ~1/3 Chrome-CPU
  if(now-fpsT>2000){ window.fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now }
  requestAnimationFrame(loop);
}

});
