<!doctype html>
<html><head><meta charset="utf-8"><title>Country Marble Race LIVE</title>
<style>html,body{margin:0;background:#0b0f1e;overflow:hidden;cursor:none}canvas{display:block;position:absolute;top:0;left:0}</style>
<script src="/matter.min.js"></script><script src="/vendor/pixi.min.js"></script><script src="/vendor/pixi-filters.js"></script><script src="/pixi-layer.js"></script><script src="/countries.js"></script>
</head><body><canvas id="p"></canvas><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Länder-Kugelrennen LIVE. Physik: Matter.js (fester 60-Hz-Takt), Darstellung: eigenes Canvas, Ton: WebAudio.
// Daten vom lokalen server.js: /api/lineup (Teilnehmer), /api/events (Chat-Beitritte), /api/result, /api/music.
// Aufbau 16:9 mit 9:16-Spalte in der Mitte: YouTube schneidet für Handys die Bildmitte aus (608 von 1920 Breite).
// Alles, was man zum Mitspielen braucht (Bahn, Aufruf, Ansagen, Sieger), liegt in dieser Spalte; links/rechts nur Zusatzinfos.
const {Engine, Bodies, Body, Composite, Events} = Matter;
const W = 1920, H = 1080, CW = 608, CX = (W-CW)/2, TW = CW, R = 17, FINISH_Y = 7900, WORLD_H = 8200, START_WAIT = 60*8, MAX_BALLS = 48;
const Q = new URLSearchParams(location.search), OFFLINE = Q.has('offline'), ZOOM_OFF = Q.get('zoom')==='0';
const OUT_W = +(Q.get('w')||1280), SC = OUT_W/W;     // Ausgabe 1280x720 spart ~55 % Rechenzeit gegenüber 1080p
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = OUT_W; cv.height = Math.round(H*SC);
const NAME = Object.fromEntries(COUNTRY_LIST.map(c=>[c[0],c[1]]));

let engine, balls, statics, spinners, t, finished, raceNo = 0, phase, phaseT, chatLog = [], camY = 0, camX = 0, camZ = 1, trackLayer, trackSeed = 0, rand;
let thirdT = 0, leader = null, lastEv = -1, board = {races:0, countries:[], players:[], fans:[]}, nextUp = [], toasts = [];

function shuffle(a,r=Math.random){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}   // fair mischen (sort(()=>rand()-0.5) bevorzugt manche Plätze)
function seedRand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

// ---------- Bahn: jedes Rennen neu aus Bausteinen gewürfelt (Zufall aus rand(), pro Rennen neu geseedet) ----------
const PALETTES = [
  // Jahrmarkt, aber harmonisch (Niklas 06.10.): je Bahn drei abgestimmte Farben statt fünf Neonfarben
  {peg:'#ffd166', ramp:'#ef476f', paddle:'#fff1d0', bump:'#ffd166', fun:'#ef476f', bg:['#1c0f22','#120a1a']},   // Karussell: Gold, Kirschrot, Creme
  {peg:'#ffc8dd', ramp:'#7fd1e8', paddle:'#ffd166', bump:'#ffc8dd', fun:'#7fd1e8', bg:['#151634','#1c1032']},   // Zuckerwatte: Rosa, Himmelblau, Gold
  {peg:'#ffd166', ramp:'#2ec4b6', paddle:'#ff8c61', bump:'#ffd166', fun:'#2ec4b6', bg:['#0d1b2a','#0f1630']},   // Riesenrad: Gold, Türkis, Koralle
];
let PAL = PALETTES[0];
// Bausteine: jeder bekommt die Start-Höhe y und baut nach unten; Rückgabe = verbrauchte Höhe.
// Regeln: Abstand zur Wand und zwischen Hindernissen ≥ 2 Kugeldurchmesser, sonst klemmen Kugeln.
const MODULES = {
  pegs(T,y){ const sp=56+Math.floor(rand()*16), rows=7+Math.floor(rand()*4), r=6+rand()*4, off=rand()*sp;
    for(let i=0;i<rows;i++) for(let x=off+(i%2?sp/2:0);x<TW;x+=sp) if(x>=90&&x<=TW-90) T.peg(x,y+40+i*(sp+28),r,PAL.peg);
    return rows*(sp+28)+80 },
  zigzag(T,y){ const n=4+Math.floor(rand()*3), gap=220+rand()*60, ang=0.13+rand()*0.08, first=rand()<0.5;
    for(let i=0;i<n;i++){ const left=(i%2===0)===first; T.wall(left?260:TW-260,y+80+i*gap,440,22,left?ang:-ang,PAL.ramp) }
    return n*gap+120 },
  paddles(T,y){ const rows=2+Math.floor(rand()*2), v=0.02+rand()*0.02;
    for(let i=0;i<rows;i++) for(let j=0;j<2;j++) T.spin(j?TW-180:180,y+120+i*290,200+rand()*20,18,((i+j)%2?1:-1)*(v+0.008*i),PAL.paddle);
    return rows*290+120 },
  bumpers(T,y){ const rows=4+Math.floor(rand()*2), cols=4, dx=150;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const x=120+c*dx+(r%2?75:0); if(x>=110&&x<=TW-110) T.peg(x,y+80+r*160,20+rand()*7,PAL.bump) }
    return rows*160+120 },
  funnel(T,y){ const g=200+rand()*40, w=(TW-80-g)/2, a=0.55+rand()*0.1, cx=TW/2+(rand()-0.5)*120;
    T.wall(40+w/2+(cx-TW/2)/2,y+120,w+40,22,a,PAL.fun); T.wall(TW-40-w/2+(cx-TW/2)/2,y+120,w+40,22,-a,PAL.fun);
    return 340 },
  windmill(T,y){ const two=rand()<0.5, v=(rand()<0.5?1:-1)*(0.04+rand()*0.02);
    const xs=two?[TW/2-150,TW/2+150]:[TW/2];
    for(const x of xs){ T.spin(x,y+200,two?200:300,18,v,PAL.paddle); T.spin(x,y+200,two?200:300,18,v,PAL.paddle,Math.PI/2) }
    return 440 },
  slalom(T,y){ const n=4+Math.floor(rand()*3), gap=190+rand()*30;
    for(let i=0;i<n;i++){ const left=i%2===0; T.wall(left?40+140:TW-40-140,y+80+i*gap,300,22,left?0.32:-0.32,PAL.fun) }
    return n*gap+120 },
  flats(T,y){ const n=3+Math.floor(rand()*2), first=rand()<0.5;
    for(let i=0;i<n;i++){ const left=(i%2===0)===first; T.wall(left?260:TW-260,y+80+i*260,440,22,left?0.12:-0.12,PAL.ramp) }
    return n*260+80 },
};
const START_Y = 480, END_Y = 6850;
let trackName = '';
// Felder auf der Bahn: wer hineinrollt, wird kurz verändert (reiner Zufall, kein Land ist bevorzugt). 3 pro Rennen, je eins pro Streckendrittel.
const ZONES = {
  speed:  {icon:'⚡', name:'SPEED',  col:'#22d3ee', dur:0},     // einmaliger Schub nach unten
  mud:    {icon:'🟤', name:'MUD',    col:'#b45309', dur:60},    // einmal stark abbremsen (dauerhafte Reibung ließ Kugeln auf Rampen stehen bleiben)
  shrink: {icon:'🔻', name:'SHRINK', col:'#c084fc', dur:300},   // 5 s kleine Kugel (assist() skaliert), rutscht durch Engstellen
  bouncy: {icon:'🏀', name:'BOUNCE', col:'#f472b6', dur:210},   // 3,5 s Flummi
};
let zones = [];
function placeZones(){
  const types = shuffle(Object.keys(ZONES), rand), seg = (END_Y-START_Y-500)/3;
  zones = [0,1,2].map(i=>{ const w=170+rand()*70; return {type:types[i], x:50+rand()*(TW-100-w), y:START_Y+400+i*seg+rand()*(seg-140), w, h:110, id:i} });
}
// Feld betreten: Wirkung starten (jede Kugel löst jedes Feld höchstens einmal aus).
function enterZone(b, z){
  b.zHit=(b.zHit||0)|(1<<z.id); endFx(b);
  if(z.type==='speed'){ Body.setVelocity(b,{x:b.velocity.x*0.6, y:Math.min(Math.max(b.velocity.y,0)+8,17)}); b.boostT=45 }
  else { b.fx=z.type; b.fxT=ZONES[z.type].dur;
    if(z.type==='mud') Body.setVelocity(b,{x:b.velocity.x*0.25, y:b.velocity.y*0.25});
    if(z.type==='bouncy'){ b.rest0=b.restitution; b.restitution=0.95 } }
}
function endFx(b){ if(b.fx==='bouncy') b.restitution=b.rest0; b.fx=null; b.fxT=0 }
// Pro Takt für alle laufenden Kugeln: Wirkung herunterzählen, Felder prüfen. Gibt [Kugel, Feld]-Paare zurück (Töne/Toasts macht der Aufrufer)
function zoneStep(bs){
  const hits=[];
  for(const b of bs){ if(b.done) continue;
    if(b.fxT>0 && --b.fxT===0) endFx(b);
    for(const z of zones) if(!((b.zHit||0)&(1<<z.id)) && b.position.x>z.x && b.position.x<z.x+z.w && b.position.y>z.y && b.position.y<z.y+z.h){ enterZone(b,z); hits.push([b,z]) } }
  return hits;
}
function buildTrack(){
  const S = [], sp = [];
  const T = {
    wall:(x,y,w,h,a=0,col='#1e293b')=>{const b=Bodies.rectangle(x,y,w,h,{isStatic:true,angle:a,friction:0.02,restitution:0.3});b.col=col;S.push(b);return b},
    peg:(x,y,r,col)=>{const b=Bodies.circle(x,y,r,{isStatic:true,restitution:0.7});b.col=col;b.peg=true;S.push(b)},
    spin:(x,y,w,h,v,col,a0=0)=>{const b=Bodies.rectangle(x,y,w,h,{isStatic:true,restitution:0.4,angle:a0});b.col=col;b.spin=v;S.push(b);sp.push(b)},
  };
  T.wall(20,WORLD_H/2,40,WORLD_H); T.wall(TW-20,WORLD_H/2,40,WORLD_H);
  // Startgitter (öffnet sich nach dem Countdown)
  const gate = T.wall(TW/2,300,TW-80,14,0,'#e2e8f0'); gate.gate = true;
  // Erst ein Stift-Feld (verteilt das Feld), dann zufällige Bausteine ohne direkte Wiederholung, bis die Strecke voll ist
  const keys=Object.keys(MODULES), used=['pegs'];
  let y = START_Y + MODULES.pegs(T, START_Y), last='pegs', ramps=0;
  const RAMPS=['zigzag','flats','slalom'];   // höchstens 2 Rampen-Bausteine, sonst wird das Rennen zäh (Simulation)
  while(true){
    const opts=keys.filter(k=>k!==last && !(ramps>=2 && RAMPS.includes(k))), k=opts[Math.floor(rand()*opts.length)];
    if(RAMPS.includes(k)) ramps++;
    if(y + 800 > END_Y) break;
    const before=S.length, spBefore=sp.length, h=MODULES[k](T,y);
    if(y+h > END_Y){ S.length=before; sp.length=spBefore; if(y+460<END_Y){ y+=MODULES.funnel(T,y); used.push('funnel') } break }
    y+=h; used.push(k); last=k;
  }
  trackName = used.join(' · ');
  // Schluss (fest): feine Stifte, Trichter, Zielkanal
  for(let r=0;r<4;r++) for(let c=0;c<11;c++){const x=48+c*56+(r%2?28:0); if(x>=90&&x<=TW-90) T.peg(x,6950+r*80,6,PAL.peg)}
  T.wall(150,7500,300,24,0.62,PAL.fun); T.wall(TW-150,7500,300,24,-0.62,PAL.fun);
  T.wall(TW/2-46,7750,20,200,0,PAL.fun); T.wall(TW/2+46,7750,20,200,0,PAL.fun);
  T.wall(TW/2,WORLD_H-20,TW,40);
  placeZones();
  return [S,sp];
}

function bakeTrack(){ // statische Teile einmal vorzeichnen (spart viel Rechenzeit pro Bild)
  trackLayer = document.createElement('canvas'); trackLayer.width = TW; trackLayer.height = WORLD_H;
  const g = trackLayer.getContext('2d');
  g.strokeStyle='rgba(255,255,255,0.04)'; g.lineWidth=2;
  for(let y=0;y<WORLD_H;y+=120){g.beginPath();g.moveTo(0,y);g.lineTo(TW,y);g.stroke()}
  for(let i=0;i<13;i++){g.fillStyle=i%2?'#fff':'#111'; g.fillRect(i*48,FINISH_Y,48,14)}
  g.font='700 36px "DejaVu Sans"'; g.fillStyle='rgba(255,255,255,0.25)'; g.textAlign='center'; g.fillText('FINISH',TW/2,FINISH_Y-20);
  for(const z of zones){ const Z=ZONES[z.type];
    g.globalAlpha=0.22; g.fillStyle=Z.col; g.fillRect(z.x,z.y,z.w,z.h); g.globalAlpha=0.9;
    g.strokeStyle=Z.col; g.lineWidth=3; g.setLineDash([10,7]); g.strokeRect(z.x,z.y,z.w,z.h); g.setLineDash([]);
    g.font='700 22px "DejaVu Sans"'; g.fillStyle='#fff'; g.textAlign='center'; g.fillText(Z.name,z.x+z.w/2,z.y+z.h-14);
    g.font='40px "Noto Color Emoji"'; g.fillText(Z.icon,z.x+z.w/2,z.y+54); g.globalAlpha=1 }
  for(const s of statics) if(!s.gate && !s.spin) drawBody(g,s);   // Paddel drehen sich, werden live gezeichnet
}

function addBall(code, players, i, bot){
  const pos = i===undefined ? {x:60+rand()*488, y:40} : {x:60+(i%12)*44+rand()*4, y:100+Math.floor(i/12)*44};
  const b = Bodies.circle(pos.x, pos.y, R, {restitution:0.75, friction:0.005, frictionAir:0.004, density:0.002});   // 0.75 = Flummi (Niklas), vorher 0.45
  Object.assign(b,{code, flag:flagOf(code), name:NAME[code]||code, players:players.slice(), still:0, trail:[], bot:bot||null});
  balls.push(b); Composite.add(engine.world,b); return b;
}

// Chaos-Rennen: jedes 10. Rennen des Tages mit Sonderregel, der Sieg zählt doppelt
const CHAOS=[{id:'moon',name:'🌙 MOON GRAVITY'},{id:'bounce',name:'🏀 SUPER BOUNCE'},{id:'quake',name:'🌋 EARTHQUAKE'},{id:'rocket',name:'🚀 ROCKET RACE'}];
let chaos=null, raceN=1;
const chaosLeft = ()=> (10 - raceN%10) % 10;      // 0 = dieses Rennen ist ein Chaos-Rennen
async function newRace(){
  raceNo++; trackSeed = (Date.now()/1000|0);
  PAL = PALETTES[raceNo % PALETTES.length];
  rand = seedRand(1000+trackSeed%100000);
  let lu;
  try { lu = OFFLINE ? null : await (await fetch('/api/lineup')).json(); } catch { lu = null; }
  if(!lu) lu = shuffle(COUNTRY_LIST.slice(0,200),rand).slice(0,30).map(c=>({code:c[0],players:[]}));
  engine = Engine.create({gravity:{y:1.3}, positionIterations:8, velocityIterations:6});
  [statics,spinners] = buildTrack();
  bakeTrack();
  Composite.add(engine.world, statics);
  balls = [];
  shuffle(lu.slice(),rand).forEach(({code,players,bot},i)=>addBall(code,players,i,bot));
  raceN = (board.races||0)+1; chaos = (!OFFLINE && chaosLeft()===0) ? CHAOS[Math.floor(Math.random()*CHAOS.length)] : null;
  if(chaos){ if(chaos.id==='moon') engine.gravity.y=0.75; if(chaos.id==='bounce') for(const b of balls) b.restitution=0.92; sfx.chaos() }
  Events.on(engine,'collisionStart',onHit);
  if(raceNo%50===0) reloadPending=true;   // alle 50 Rennen frisch laden (Speicher)
  if(finalMin()) toast('🔥 FINAL RACES of the hour – type your country!','#f87171',300);
  t=0; finished=[]; results=[]; slowT=-1; slowDone=false; timeScale=1; phase='countdown'; phaseT=0; nextUp=[]; leader=null; winAt=-1; comebackRank={};
  balls.forEach(b=>vload('win-'+b.code));
  if(chaos) say(['chaos',chaos.id,'double'],2);
  else if(finalMin() && saidFinal!==board.hourEnds){ saidFinal=board.hourEnds; say(['final-minutes'],2) }
  else say([['type-country','own-ball','get-ready'][raceNo%3]],2);
  if(musicWant()===musicMode) mixNext(DECK[musicMode]);   // Mix: jedes Rennen ein anderes Lied (Niklas 06.10.)
}

// Aufholjagd, sichtbar: der Führende trägt die Krone und wird größer, je weiter er allein vorne fährt (bleibt eher an Stiften hängen),
// die ersten drei bekommen dabei wie bisher etwas Luftwiderstand. Alle 5 s bekommt die hinterste Kugel im Bild einen Turbo (pro Kugel einmal je Rennen).
// Wird auch von der Simulation benutzt (gibt die Turbo-Kugel zurück, Töne/Toasts macht der Aufrufer).
const CROWN_MAX = 1.35, TURBO_EVERY = 60*5, TURBO_LEN = 80;
function assist(bs, tt, nFin){
  const run=bs.filter(b=>!b.done).sort((a,b)=>b.position.y-a.position.y);
  run.forEach((b,i)=>{ const gap=i<3&&run[4]?b.position.y-run[4].position.y:0; b.frictionAir=0.004+Math.min(Math.max(gap-200,0)/800,1)*0.022;
    b.crown = i===0 && !nFin;
    const want = (b.crown ? 1+Math.min(Math.max(gap-120,0)/500,1)*(CROWN_MAX-1) : 1)*(b.fx==='shrink'?0.7:1), cur=b.circleRadius/R;
    if(Math.abs(want-cur)>0.005){ const f=Math.min(Math.max(want/cur,0.992),1.008); Body.scale(b,f,f) }
    if(b.turboT>0){ b.turboT--; b.frictionAir=0.001; b.force.y += b.mass*0.0011;   // ~85 % mehr Schwerkraft
      if(b.velocity.y>17) Body.setVelocity(b,{x:b.velocity.x,y:17}) } });   // gedeckelt, sonst tunnelt sie durch Stifte
  if(tt<60*4 || tt%TURBO_EVERY || nFin || run.length<6) return null;
  const lead=run[0], cand=run.slice(3).filter(b=>!b.hadTurbo && lead.position.y-b.position.y<620);   // 620 ≈ was hinter dem Ersten noch im Bild ist
  const b=cand[cand.length-1]; if(!b) return null;
  b.hadTurbo=true; b.turboT=TURBO_LEN; Body.setVelocity(b,{x:b.velocity.x*0.5, y:Math.min(Math.max(b.velocity.y,0)+5,17)}); return b;
}

// Highlight-Clips (clips.js auf dem Server): wie spannend war das Rennen? Die besten werden als Short-Kandidaten mitgeschnitten.
let goAt=0, leadTimes=[];
function reportHighlight(w, s){
  if(OFFLINE) return;
  const gap=s ? s.ft-w.ft : 99, late=leadTimes.filter(x=>x>w.ft-60*5).length, dur=(performance.now()-goAt)/1000;
  let score=1, kind='race';
  if(slowDone){ score+=5; kind='photo' } else if(gap<=18) score+=3;
  if(chaos){ score+=3; if(kind==='race') kind='chaos' }
  if(w.hadTurbo){ score+=4; if(kind==='race') kind='turbo' }
  if((comebackRank[w.id]||0)>=6){ score+=2; if(kind==='race') kind='comeback' }
  score+=Math.min(late,3); if(w.players.length) score+=2; if(dur>34) score-=3;
  fetch('/api/highlight',{method:'POST',body:JSON.stringify({score, kind, goAgoMs:Math.round(performance.now()-goAt), dur:+dur.toFixed(1),
    winner:w.code, name:w.name, player:w.players[0]||'', chaos:chaos?chaos.id:'', race:raceNo})}).catch(()=>{});
}

function step(){
  phaseT++;
  for(const o of toasts) o.t++;
  toasts = toasts.filter(o=>o.t<o.life);
  for(const s of spinners) Body.setAngle(s, s.angle+s.spin);
  if(phase==='countdown'){
    if(phaseT%60===0 && phaseT<START_WAIT) sfx.beep(phaseT>=START_WAIT-60?880:440);
    if(phaseT>=START_WAIT){ phase='race'; phaseT=0; sfx.go();
      for(const b of balls) if(b.players.length && carry[b.players[0]]){ b.charge=Math.min(3,(b.charge||0)+carry[b.players[0]]); delete carry[b.players[0]]; b.startPush=true } goAt=performance.now(); leadTimes=[]; say([raceNo%2?'off':'here-we-go'],2); const g=statics.find(s=>s.gate); Composite.remove(engine.world,g); statics=statics.filter(s=>!s.gate)}
  }
  Engine.update(engine, 1000/60);
  if(phase!=='race' && phase!=='podium') return;
  t++;
  if(phase==='race' && chaos){ const run=balls.filter(b=>!b.done);
    if(chaos.id==='quake' && t%(60*4)===0){ for(const b of run) Body.setVelocity(b,{x:b.velocity.x+(Math.random()-0.5)*14, y:b.velocity.y-Math.random()*4}); sfx.quake(); say(['quake']); toast('🌋 EARTHQUAKE!','#c084fc',90) }
    if(chaos.id==='rocket' && t%(60*3)===0 && run.length){ const b=run[Math.floor(Math.random()*run.length)]; Body.setVelocity(b,{x:b.velocity.x*0.6, y:Math.min(Math.max(b.velocity.y,0)+8,17)}); b.boostT=45; sfx.boost() } }
  if(phase==='race'){ const tb=assist(balls, t, finished.length);
    if(tb){ sfx.turbo(); if(tb.players.length) toast(`🔥 TURBO for ${tb.flag} ${tb.name}! (${tb.players[0]})`,'#fb923c',120) }
    for(const [b,z] of zoneStep(balls)){ const Z=ZONES[z.type]; if(z.type==='speed') sfx.boost();
      if(b.players.length) toast(`${Z.icon} ${b.players[0]} hit ${Z.name}!`, Z.col, 120) } }
  if(phase==='race') for(const b of balls){ if(b.done || !(b.charge>0) || !b.players.length) continue;
    b.chargeCd=(b.chargeCd||0)-1; if(b.chargeCd>0) continue;
    const why = b.startPush && t>45 ? 'start' : b.still>30 ? 'stuck' : b.position.y>FINISH_Y-1400 ? 'final' : null;
    if(why){ b.startPush=false; b.charge--; b.chargeCd=75; boost(b, b.players[0], why) } }
  // Bots boosten selbst, schwächer als ein Zuschauer: Rita 2× (wenn sie hängt / Zielgerade), Carl 1× gleich nach dem Start, Bob nie
  if(phase==='race') for(const b of balls){ if(b.done || !b.bot) continue;
    if(b.botLeft===undefined) b.botLeft={'Robo-Rita':2,'CPU-Carl':1}[b.bot]||0;
    b.chargeCd=(b.chargeCd||0)-1; if(!(b.botLeft>0) || b.chargeCd>0) continue;
    const why = b.bot==='CPU-Carl' && t>70 ? 'start' : b.still>30 ? 'stuck' : b.position.y>FINISH_Y-1400 ? 'final' : null;
    if(why){ b.botLeft--; b.chargeCd=75; boost(b, '🤖 '+b.bot, why, 0.7) } }
  // Zeitlupe, wenn die ersten zwei dicht beieinander auf die Ziellinie zurollen (einmal pro Rennen)
  if(phase==='race' && !slowDone && !finished.length){ const [a,c]=ranking();
    if(a && c && a.position.y>FINISH_Y-280 && a.position.y-c.position.y<2.5*R){ slowDone=true; slowT=0; sfx.slow() } }
  if(slowT>=0){ slowT++; if(slowT>55 || (finished.length>=2 && t-finished[1].ft>8) || phase!=='race') slowT=-1 }

function mixNext(d){

  d.g.gain.cancelScheduledValues(AC.currentTime); d.g.gain.setTargetAtTime(0, AC.currentTime, 0.2);

    if(musicMode===(d.dnb?'dnb':'calm')){ d.g.gain.cancelScheduledValues(AC.currentTime); d.g.gain.setTargetAtTime(MUSIC_VOL, AC.currentTime+0.15, 0.25) } }, 900);

async function playNext(d, seek){
  if(Date.now()-lastFetch > 10*60000){ try{ const all = await (await fetch('/api/music')).json(); lastFetch = Date.now();   // neue Stücke ab und zu nachladen
    for(const x of Object.values(DECK)){ const l = all.filter(n=>/dnb/i.test(n)===x.dnb); if(l.slice().sort().join()!==x.list.slice().sort().join()){ x.list = shuffle(l); x.i = 0 } } }catch{} }
  const l = d.list.length ? d.list : (d.dnb ? DECK.calm : DECK.dnb).list;   // fehlt eine Sorte, nimm die andere
  if(!l.length){ lastFetch = 0; setTimeout(()=>playNext(d), 30000); return }
  if(d.i >= l.length){ shuffle(l); d.i = 0 }

async function say(names, rank=1){
  const now = AC.currentTime, busy = now < vEnd;
  if(busy && rank <= vRank) return;                 // Wichtigeres läuft gerade
  if(rank===1 && now < vEnd+5) return;               // Füllsätze nicht im Dauerfeuer
  vRank = rank; vEnd = now + 3;                        // reservieren, bis die Dateien da sind
  const bufs = (await Promise.all(names.map(vload))).filter(Boolean);
  if(!bufs.length || vRank !== rank){ if(vRank===rank) vEnd = 0; return }
  if(vSrc) for(const s of vSrc) try{ s.stop() }catch{}
  let t0 = AC.currentTime + 0.03; vSrc = [];
  for(const b of bufs){ const s = AC.createBufferSource(); s.buffer = b; s.connect(voiceBus); s.start(t0); vSrc.push(s); t0 += b.duration + 0.12 }
  vEnd = t0;
  musicBus.gain.cancelScheduledValues(AC.currentTime);
  musicBus.gain.setTargetAtTime(0.35, AC.currentTime, 0.05); musicBus.gain.setTargetAtTime(1, t0, 0.3);

  camX += (Math.min(Math.max(lead.position.x-VW/2,0),TW-VW)-camX)*0.1; camX=Math.min(Math.max(camX,0),TW-VW);
  const target=Math.min(Math.max(lead.position.y-H*(camZ>1.05?0.5:0.54)/camZ,-330/camZ),WORLD_H-VH+330/camZ);   // +360: Ziel und Auslauf bleiben über dem Chat   // Handy (Niklas 06.10.): Chat verdeckt unten ab ~y 615 → Geschehen in die obere Hälfte; -120: Startgitter direkt unter dem Aufruf-Balken   // Kamera immer auf dem Ersten (Niklas)

      for(let j=0;j<7;j++){ const fl=r*(2.4+Math.random()*1.6)*(1-j/9), ox=(Math.random()-0.5)*r*0.8;

        ctx.beginPath(); ctx.ellipse(b.position.x+ox,b.position.y-r*0.3-fl*0.5-j*r*0.5,r*(0.95-j*0.08),fl*0.55,0,0,7); ctx.fill() }

    if(b.bot){ ctx.strokeStyle=BOT_COL; ctx.lineWidth=3; ctx.globalAlpha=0.8; ctx.beginPath(); ctx.arc(b.position.x,b.position.y,r+4,0,7); ctx.stroke(); ctx.globalAlpha=1 }
    if(b.players.length){ ctx.strokeStyle='#fde047'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(b.position.x,b.position.y,r+4,0,7); ctx.stroke();
      if(phase==='countdown'){ ctx.globalAlpha=0.45; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(b.position.x,b.position.y,r+14,0,7); ctx.stroke(); ctx.globalAlpha=1 } }   // Spieler am Start sofort finden
    if(b.boostT>0){ b.boostT--; const k=b.boostT/45; ctx.strokeStyle='#22d3ee'; ctx.lineWidth=5; ctx.globalAlpha=k;
      ctx.beginPath(); ctx.arc(b.position.x,b.position.y,r+8+(1-k)*26,0,7); ctx.stroke();
      for(let j=0;j<6;j++){ const a=j*1.047+b.boostT*0.3, rr=R+10+(1-k)*30; ctx.fillStyle=j%2?'#fde047':'#22d3ee'; ctx.fillRect(b.position.x+Math.cos(a)*rr-3,b.position.y-Math.sin(a)*rr*0.6-rr*0.5-3,6,6) }

  }
  const nx = x => Math.min(Math.max(x,camX+70/camZ),camX+(TW-70)/camZ);
  for(const b of balls) if(b.bot && b.position.y>camY-40 && b.position.y<camY+H/camZ+40)

  for(const b of balls) if(b.players.length && b.position.y>camY-40 && b.position.y<camY+H/camZ+40)
    txt((phase==='countdown' && Date.now()-(joinedAt[b.players[0]]||0)<180000 ? 'NEW ' : '')+who(b)+(b.charge>0?' '+'⚡'.repeat(b.charge):'')+(b.done&&b.pts?` +${b.pts}`:''),nx(b.position.x),b.position.y-b.circleRadius-10-(b.crown&&!b.done&&phase==='race'?b.circleRadius*1.2:0),30,'#fde047','700','center',220,true);
  ctx.restore();
  if(timeScale<0.9){ const k=Math.min(1,(1-timeScale)/0.5);   // Zeitlupe: heller Schleier + Schriftzug

// ---------- Jahrmarkt-Glanz (Niklas 06.10.: „bisschen bling bling wie am Jahrmarkt“) ----------
// Glühbirnen laufen ruhig im Kreis (kein hartes Blinken): jede dritte Birne gedimmt, Muster wandert langsam weiter.
function bulb(x,y,on){ ctx.fillStyle=on?'rgba(255,209,102,0.28)':'rgba(255,209,102,0.06)'; ctx.beginPath(); ctx.arc(x,y,on?8:5,0,7); ctx.fill();
  ctx.fillStyle=on?'#ffe9a8':'#7a5a2a'; ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fill() }
function bulbRow(x,y,w,dir=0){ const n=Math.floor(w/22), k=Math.floor(Date.now()/220); for(let i=0;i<=n;i++) bulb(x+i*w/n,y,(i+(dir?-k:k)%3+300)%3!==0) }
function bulbRing(cx,cy,r,n){ const k=Math.floor(Date.now()/220); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; if(Math.sin(a)>0.8) continue; bulb(cx+Math.cos(a)*r,cy+Math.sin(a)*r,(i+k)%3!==0) } }   // unten frei für den Ländernamen
// sanftes Glimmen statt hartem Blinken (Schlussminuten, Chaos)
const glow=(a,b)=>{ const k=(1+Math.sin(Date.now()/450))/2; return `rgba(${a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(',')},0.95)` };
let conf=[];
function confetti(n){ const cols=PAL===PALETTES[1]?['#ffc8dd','#7fd1e8','#ffd166','#fff']:['#ffd166','#ef476f','#2ec4b6','#fff1d0','#ff8c61'];
  for(let i=0;i<n;i++) conf.push({x:CX+Math.random()*CW, y:280-Math.random()*300, vx:(Math.random()-0.5)*2, vy:1.5+Math.random()*2.5, a:Math.random()*6, va:(Math.random()-0.5)*0.3, s:6+Math.random()*6, c:cols[i%cols.length]}) }
function drawConfetti(){ if(!conf.length) return; ctx.save(); ctx.beginPath(); ctx.rect(CX,378,CW,H-378); ctx.clip();
  for(const p of conf){ p.x+=p.vx+Math.sin(p.a)*0.6; p.y+=p.vy; p.a+=p.va; ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore() }
  ctx.restore(); conf=conf.filter(p=>p.y<H+20) }

// ---------- Takt ----------
let acc=0, last=performance.now(), lastDraw=0, fpsN=0, fpsT=last; window.fps=0;
function loop(now){
  acc += Math.min(now-last, 250)*timeScale; last=now;   // timeScale < 1 = Zeitlupe
  let n=0; while(acc>=1000/60 && n<6){ if(phase!=='loading') step(); acc-=1000/60; n++ }
  if(acc>1000/60) acc=0;                   // zu langsam: lieber Zeit verlieren als ruckeln
  if(phase!=='loading' && now-lastDraw>=31){ lastDraw = now-lastDraw>100 ? now : lastDraw+1000/30; draw(); fpsN++ }   // 30 Bilder/s reichen (ffmpeg greift 30 ab), spart ~1/3 Chrome-CPU
  if(now-fpsT>2000){ window.fps=fpsN*1000/(now-fpsT); fpsN=0; fpsT=now }
  requestAnimationFrame(loop);
}
const origNew = newRace;
newRace = async()=>{ phase='loading'; await origNew() };
document.fonts.load('40px "Noto Color Emoji"','🇩🇪').then(async()=>{
  try { await PX.init(document.getElementById('p'), OUT_W, Math.round(H*SC), SC, {W,H,CX,CW}) } catch(e){ console.log('Pixi aus: '+e) }   // ohne WebGL: alles wie bisher auf Canvas 2D
  await newRace(); setInterval(pollChat,500); setInterval(pollBoard,5000); pollBoard(); pollVersion(); setInterval(pollVersion,30000);
  if(!OFFLINE) fetch('/api/clipgeom',{method:'POST',body:JSON.stringify({x:CX*SC, w:CW*SC, h:H*SC})}).catch(()=>{});   // wo die 9:16-Spalte für Clips liegt
  AC.resume(); DECK.calm.g.gain.value = MUSIC_VOL; playNext(DECK.calm); setInterval(()=>setMusic(musicWant()), 500); requestAnimationFrame(loop);
});
